<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경력사원 온보딩 진단 설문</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --ink:#1a2230;--ink-soft:#4a556a;--line:#e3e7ee;--line-soft:#eef1f6;--bg:#f6f7fa;--card:#fff;
    --accent:#1f6feb;--accent-soft:#eaf1fe;--warn:#b4530a;--ok:#0f7a4d;--ok-soft:#e7f4ee;
    --mood:#0f7a4d;--mood-soft:#eef8f2;--mood-line:#cdead9;
    --shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);--r:14px;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:'Pretendard',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
  /* 멘트는 단어 중간에서 끊기지 않게(keep-all), 여러 줄이면 줄 길이를 고르게(balance/pretty) */
  .mood,.thanks,.done p,.return-box p,h1,h2,h3{text-wrap:balance}.lead,.hint,.q .qt,.dual .item-d{text-wrap:pretty}
  .nw{white-space:nowrap}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1f6feb,#0b3d91);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .brand b{font-size:15px;font-weight:700}.brand span{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}.lead{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.12s;background:#fff;text-align:left}
  .tile:hover{border-color:#b9c6e6}
  .tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(31,111,235,.08)}
  .tile .t{font-weight:700;font-size:15px}.tile .d{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  label.fld{display:block;margin-top:16px}
  label.fld .lb{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
  label.fld .lb .req{color:var(--warn)}
  input[type=text],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;transition:.12s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.10)}
  textarea{resize:vertical;min-height:84px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:13px 22px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
  .btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#155fd4}
  .btn.primary:disabled{background:#b9c6e6;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:#b9c6e6}
  .actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px;align-items:center;flex-wrap:wrap}
  .prog-bottom{margin-top:26px}
  .prog{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .step-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between}
  .mood{background:var(--mood-soft);border:1px solid var(--mood-line);border-radius:12px;padding:14px 16px;font-size:13px;color:#1d5c40;margin-bottom:20px;line-height:1.6}
  .theme{margin-top:26px}.theme:first-child{margin-top:8px}
  .theme-h{font-size:12.5px;font-weight:800;color:var(--ink);background:var(--line-soft);border-radius:8px;padding:8px 12px;display:inline-block;margin-bottom:6px}
  .q{padding:18px 2px;border-bottom:1px solid var(--line-soft)}
  .q .qt{font-size:14.5px;font-weight:600;margin-bottom:14px}.q .qt .num{color:var(--accent);font-weight:800;margin-right:8px}
  .likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lk{border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:.12s;background:#fff}
  .lk:hover{border-color:#b9c6e6}.lk.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(31,111,235,.08)}
  .lk .sc{font-size:17px;font-weight:800;color:var(--ink)}.lk .ll{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.25}
  .lk.on .sc{color:var(--accent)}
  .dual{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
  .dual .cat{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
  .dual .item-t{font-weight:700;font-size:14px;margin:2px 0 3px}.dual .item-d{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .dual .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dual .cols .cl{font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-soft)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .pill{display:inline-block;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 11px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .done{text-align:center;padding:40px 20px}
  .done .ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px}
  .done h2{margin:0 0 6px;font-size:20px}.done p{color:var(--ink-soft);font-size:14px;margin:0 auto;max-width:460px}
  .done .thanks{margin-top:14px;font-size:13.5px;color:#1d5c40;background:var(--mood-soft);border:1px solid var(--mood-line);border-radius:10px;padding:12px 16px;max-width:460px;margin-left:auto;margin-right:auto}
  .return-box{background:var(--ok-soft);border:1px solid #bfe3d0;border-radius:12px;padding:18px;margin:22px auto 0;max-width:520px;text-align:left}
  .return-box h3{margin:0 0 6px;font-size:14px;color:var(--ok)}
  .return-box p{font-size:13px;color:var(--ink-soft);margin:0 0 12px}
  .code-area{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;height:70px;resize:none;color:var(--ink-soft)}
  .mini-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn.sm{padding:9px 14px;font-size:13px}
  .err-banner{background:#fdecec;color:#a11;border:1px solid #f6c9c9;border-radius:10px;padding:11px 14px;font-size:13px;margin-top:16px;display:none}
  .err-banner.show{display:block}
  .muted{color:var(--ink-soft);font-size:13px}
  .hidden{display:none!important}
  input:disabled,select:disabled,textarea:disabled{background:#f1f3f7;color:#7a8497;cursor:not-allowed;-webkit-text-fill-color:#7a8497;opacity:1}
  .pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .pcol{border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px}
  .pcol.locked{background:#fafbfd}
  .pcol .ph{font-size:12px;font-weight:800;color:var(--accent);margin-top:10px}
  .pcol.locked .ph{color:var(--ink-soft)}
  .pcol .ph span{font-weight:600;color:var(--ink-soft);margin-left:6px}
  /* 내가 할 일 연동(제출 직후 남은 단계, 다음 사람에게 보내는 완료 메일). 본문 스타일과 겹치지 않게 .mt 안에서만 적용 */
  .mt{--red:#c62828;--red-soft:#fdecec;--warn-soft:#fdf4e7}
  .mt .box{margin-top:20px;text-align:left;border:1.5px solid var(--accent);border-left-width:6px;background:var(--accent-soft);border-radius:12px;padding:18px 18px 16px}
  .mt .box.ok{border-color:#bfe3d0;background:var(--ok-soft)}
  .mt .box h3{font-size:16.5px;font-weight:800;color:var(--accent);margin:0 0 4px}
  .mt .box.ok h3{color:var(--ok)}
  .mt .box .lead{font-size:13.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6}
  .mt .alert{margin:0 0 14px;text-align:left;background:var(--red-soft);border:1.5px solid #f0a8a8;border-left-width:6px;border-radius:12px;padding:13px 16px;color:#7a1414;font-size:13.5px;line-height:1.6}
  .mt .alert b{color:var(--red);font-size:15px}
  .mt .pg{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
  .mt .bar{flex:1;height:7px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .mt .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .mt .t{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:9px;flex-wrap:wrap;text-align:left}
  .mt .t .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .mt .t.wait .no{background:#9aa5b8}.mt .t.dn .no{background:var(--ok)}
  .mt .t .body{flex:1;min-width:220px}
  .mt .t .ti{font-size:15px;font-weight:800}
  .mt .t .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.7}
  .mt .chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 10px;margin-right:6px}
  .mt .chip.go{background:var(--ok-soft);color:var(--ok)}.mt .chip.wt{background:#eef0f4;color:#5b6678}.mt .chip.dn{background:var(--ok-soft);color:var(--ok)}.mt .chip.due{background:var(--warn-soft);color:var(--warn)}.mt .chip.hot{background:var(--red);color:#fff}
  .mt .btn.red{background:var(--red);color:#fff}.mt .btn.red:hover{background:#a51f1f}
  .mt .btn[disabled]{background:#cfd6e4;color:#fff;cursor:not-allowed}
  .mt .btn.link{text-decoration:none}
  .mt .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mt .mtone{white-space:nowrap}   /* 안내 문장은 한 줄로(좁은 화면에서는 줄바꿈 허용) */
  @media(max-width:760px){.mt .mtone{white-space:normal}}
  .mt ul.mtnote{margin:10px 0 0;padding-left:20px;font-size:12px;color:var(--ink-soft);line-height:1.7}
  .mt ul.mtnote li+li{margin-top:2px}
  .mt .grp{margin-top:20px}.mt .grp:first-of-type{margin-top:6px}
  .mt .grp h3{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0}
  .mt .grp .gsub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .mt .sub2{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .mt p{max-width:none}
  .mt .sub2>b{font-size:13.5px}
  .mt .pv{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .mt .pvsub{background:#f3f5f9;border-bottom:1px solid var(--line);padding:10px 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
  .mt .pvsub b{color:var(--ink)}
  .mt .pvbody{padding:16px;overflow-x:auto}
  .mt .foot{margin-top:14px;font-size:13px;color:var(--ink-soft)}
  .mt .foot a{color:var(--accent);font-weight:700}
  .mtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1a2230;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
  .mtoast.show{opacity:1}
  @media(max-width:640px){.wrap{padding:18px 14px 70px}.grid2,.row2,.row3,.dual .cols,.pcols{grid-template-columns:1fr}.likert{grid-template-columns:repeat(5,1fr);gap:5px}.lk{padding:9px 2px}.lk .ll{display:none}.card{padding:20px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand"><div class="mk">HR</div>
    <div><b>경력사원 온보딩 진단</b><span>인재개발팀 · Talent Development</span></div></div></div>
  <div id="app"></div>
</div>
<script>
const HRDEST='인재개발팀';
/* ===== [HR 설정] 자동 취합 =====
   Google Apps Script 웹앱 배포 주소. 제출 시 이 주소로 자동 전송된다(대상자 회신 불필요).
   비워두면 파일/코드 저장 방식으로 폴백. */
const SUBMIT_URL='https://script.google.com/macros/s/AKfycbzlnIEmzzjXChTsjjyRvaFaC_YPVfH037HjVCDGcjwdFBojbtNpd34VJYBL0jKF0n9N/exec';
const LIKERT=[{v:5,l:'매우\n그렇다'},{v:4,l:'그렇다'},{v:3,l:'보통'},{v:2,l:'그렇지\n않다'},{v:1,l:'전혀\n그렇지 않다'}];
const SELF_ITEMS=[
  {cat:'직무 역량',t:'성과 달성도',d:'부여된 업무 및 과제를 기한 내 기대 수준에 부합하는 결과물을 생산하는가?'},
  {cat:'직무 역량',t:'직무 전문성',d:'보유한 경력과 지식을 적용하여 실무에 직접적으로 기여하고 있는가?'},
  {cat:'직무 역량',t:'직무 적합성',d:'담당 직무 수행에 필요한 핵심 역량과 전문성을 보유하고 있는가?'},
  {cat:'직무 역량',t:'확장 가능성',d:'현재 직무 범위를 넘어 향후 상위 역할로의 성장 잠재력을 보이는가?'},
  {cat:'조직 적응',t:'조직 적합성',d:'회사의 핵심 가치와 일하는 방식을 존중하며, 조직의 분위기와 문화에 적응하려 노력하는가?'},
  {cat:'조직 적응',t:'협업 능력',d:'동료 및 유관 부서와 원활하게 소통하며, 공동의 목표 달성을 위해 적극적으로 협력하는가?'},
  {cat:'조직 적응',t:'책임감/성실성',d:'본인에게 부여된 역할에 대해 주인 의식을 갖고, 문제 시 대안을 찾아 끝까지 완수하려 노력하는가?'}
];
const SURVEYS={
  '1_new':{round:'1차',roundTag:'D+30',role:'입사자',title:'(1차, D+30) 채용 Quality 진단 · 입사자',
    desc:'',themes:[
    {cat:'(A) 채용 결정 및 기대 일치',q:[
      {t:'L',text:'채용 과정(공고, 면접, 오퍼)에서 안내받은 내용이 명확하고 신뢰할 수 있었다.'},
      {t:'L',text:'최종 처우 및 근무조건 협의 과정이 투명하고 합리적이었다.'},
      {t:'T',text:'입사 결정에 가장 크게 작용한 요인은 무엇이었나요? (처우/직무/조직문화/성장기회 등)'}]},
    {cat:'(B) 직무 및 역할 Fit',q:[
      {t:'L',text:'채용 시 안내받은 직무/역할 내용이 실제 배치된 업무와 대체로 일치한다.'},
      {t:'L',text:'현재 담당 업무가 본인의 경력과 전문성을 발휘하기에 적합하다.'},
      {t:'T',text:'채용 시 기대와 실제 업무 간 차이가 있었다면 어떤 부분인가요?'}]},
    {cat:'(C) 초기 적응 및 프로세스 개선',q:[
      {t:'L',text:'입사 첫 달, 팀과 업무에 적응하는 데 큰 어려움은 없었다.'},
      {t:'L',text:'전반적으로 이번 채용 프로세스에 만족한다.'},
      {t:'T',text:'채용 프로세스에서 개선되었으면 하는 점이 있다면 자유롭게 적어주세요.'}]}]},
  '1_hm':{round:'1차',roundTag:'D+30',role:'팀장(HM)',title:'(1차, D+30) 채용 Quality 진단 · Hiring Manager',
    desc:'담당하신 입사자에 대한 채용 품질을 평가합니다.',themes:[
    {cat:'(A) 서류·면접 대비 실제 부합도',q:[
      {t:'L',text:'서류/면접에서 파악된 역량과 실제 초기 업무 수행 역량이 대체로 부합한다.'},
      {t:'L',text:'채용 시 기대했던 직무 적합성 수준에 부합하고 있다.'},
      {t:'T',text:'서류/면접 시점과 실제 역량 간 차이가 있었다면 어떤 부분인가요?'}]},
    {cat:'(B) 초기 성과 및 적응 속도',q:[
      {t:'L',text:'현재까지의 초기 적응 속도가 기대 수준이다.'},
      {t:'L',text:'초기 업무 수행 결과물의 수준이 기대에 부합한다.'},
      {t:'T',text:'조기 안정적 전력화를 위해 추가로 필요한 지원이 있다면 적어주세요.'}]},
    {cat:'(C) 채용 종합 판단',q:[
      {t:'L',text:'이 채용 건은 전반적으로 성공적인 채용이었다고 평가한다.'},

function standardSurvey(s){

        <textarea oninput="setText('${id}',this.value)" placeholder="자유롭게 작성해 주세요">${esc(state.answers[id]||'')}</textarea></div>`;}

    html+=`</div>`;
  }
  return shell(s,html);

function dualSurvey(s){

    html+=`<div class="dual"><div class="cat">${esc(it.cat)}</div><div class="item-t">${i+1}. ${esc(it.t)}</div><div class="item-d">${esc(it.d)}</div>

      </div></div>`;});
  html+=`<div class="theme"><div class="theme-h">면담 확인</div>
    <p class="hint" style="margin:8px 0 4px">입사자와 팀장 간 면담을 통해 피드백 내용을 공유하였음을 확인하며 서명(성명 입력)합니다.</p>
    <div class="row3">

      <label class="fld"><span class="lb">입사자 서명 <span style="font-weight:500;color:var(--ink-soft)">(자동 입력)</span></span><input type="text" value="${esc(state.answers.signNew||'')}" placeholder="입사자 성명" disabled></label>

    </div></div>`;
  return shell(s,html);
}
/* 팀장(HM) 화면 인적사항: 입사자 칸은 잠그고, 지금 작성하는 팀장 본인 칸(소속/성명)만 입력 가능 */

function hmPanel(){

function setLikert(id,v){state.answers[id]=v;render();}
function setText(id,v){state.answers[id]=v;updateProgress();}
function backToEntry(){state.step='entry';window.scrollTo(0,0);render();}
function requiredKeys(){
  const s=SURVEYS[state.key],keys=[];
  if(s.dual){
    const hasIn=state.selfIn&&state.selfIn.s;
    s.items.forEach((_,i)=>{ if(!hasIn)keys.push('self'+i); keys.push('fb'+i); });
    keys.push('meetDate','signNew','signHM');
  }
  else{
    let n=0;s.themes.forEach(th=>th.q.forEach(()=>{n++;keys.push('q'+n)}));
    if(s.selfCheck){SELF_ITEMS.forEach((_,i)=>keys.push('sc'+i));}
  }
  return keys;
}
function updateProgress(){
  const keys=requiredKeys(),done=keys.filter(k=>{const v=state.answers[k];return v!==undefined&&v!=='';}).length;
  const pct=Math.round(done/keys.length*100);
  const bar=document.getElementById('progBar'),txt=document.getElementById('pctTxt');
  if(bar)bar.style.width=pct+'%';if(txt)txt.textContent=pct+'%';
}
/* HR이 메일 자동화로 미리 심어둔 '미완료' 행과 같은 code로 매칭되도록 제출 코드를 계산한다.
   HR이 링크에 code= 를 실어 보낸 경우(1차 전체, 2차 입사자)는 그 값을 그대로 쓰고,
   2차 팀장(HM)은 핸드오프(scref)로만 들어와 code가 없으므로 대상자/입사일로 같은 규칙의
   코드를 직접 계산한다(HR 쪽 시딩 스크립트와 반드시 동일한 규칙: 2H-대상자-MMDD). */
function mmddOf(hire){ const parts=String(hire||'').split('-'); return parts.length===3?parts[1]+parts[2]:''; }
function submissionCode(){
  if(state.linkCode) return state.linkCode;
  if(state.key==='2_hm'){ const p=state.profile; if(p.target&&p.hire) return '2H-'+p.target+'-'+mmddOf(p.hire); }
  return '';
}
/* 제출 직전에 링크가 닫혔는지 다시 확인한다(열어 둔 화면에서 관리자가 실시간으로 닫은 경우). 응답이 늦거나 실패하면 막지 않는다(fail-open). */
function linkClosedNow(){
  return new Promise(resolve=>{
    if(!state.linkCode||!SUBMIT_URL){ resolve(false); return; }
    let done=false; const fin=v=>{ if(done)return; done=true; resolve(v); };
    const cb='__linkNow'+Date.now();
    window[cb]=(resp)=>fin(!resp||!resp.ok?false:(resp.status==='closed'?'closed':(resp.done?'done':false)));
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=checkLink&code='+encodeURIComponent(state.linkCode)+'&k='+encodeURIComponent(linkKey())+'&hire='+encodeURIComponent(state.profile.hire||'')+'&callback='+cb+'&_='+Date.now();
    s.onerror=()=>fin(false); document.body.appendChild(s); setTimeout(()=>fin(false),9000);
  });
}
async function submitSurvey(){
  if(SURVEYS[state.key].role==='팀장(HM)'){
    syncHmProfile();
    if(!state.profile.dept||!state.profile.name){const e=document.getElementById('surveyErr');e.textContent='팀장 소속과 성명을 입력해 주세요.';e.classList.add('show');window.scrollTo(0,0);return;}
  }
  const keys=requiredKeys(),missing=keys.filter(k=>{const v=state.answers[k];return v===undefined||v==='';});
  if(missing.length){const e=document.getElementById('surveyErr');e.textContent=`미작성 항목이 ${missing.length}개 있습니다. 모든 문항을 작성해 주세요.`;e.classList.add('show');window.scrollTo(0,document.body.scrollHeight);return;}
  const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent='제출 중...';
    if(!document.getElementById('subNote'))btn.insertAdjacentHTML('afterend','<div id="subNote" style="margin-top:8px;font-size:12px;color:var(--ink-soft)">제출하고 있어요. 서버가 바쁠 때는 1분 정도 걸릴 수 있으니 <b>다시 누르지 말고</b> 기다려 주세요.</div>');}
  /* 최근 10분 안에 링크가 열려 있다고 확인했다면 제출 직전 재확인(서버 왕복 1회)을 생략한다 */
  const lc=(LINK.okAt&&Date.now()-LINK.okAt<600000)?false:await linkClosedNow();
  if(lc==='closed'){ state.step='closed'; window.scrollTo(0,0); render(); return; }
  if(lc==='done'){ state.step='alreadyDone'; window.scrollTo(0,0); render(); return; }
  const rec=buildRecord();state.lastRec=rec;
  if(SUBMIT_URL){
    try{
      await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({_kind:'survey',_sheet:sheetNameFor(state.key),_code:submissionCode(),record:rec})});
      state.sent=true; fireRefresh();
    }catch(e){ state.sent=false; downloadJSON(rec); }
  }else{
    state.sent=false; downloadJSON(rec);
  }
  if(state.key==='2_new'&&!state.me){ await sendSelfHandoff(); }   /* me가 있으면 팀장이 시트에서 직접 읽으므로 전달용 임시 저장이 필요 없음 */
  state.step='done';window.scrollTo(0,0);render();
}
/* 제출이 저장된 뒤 회차 평균/월별 추적 갱신을 서버에 따로 요청한다. 응답을 기다리지 않으므로 제출 화면은 이 갱신 시간만큼 빨라진다(서버 v7.2 이상, 이전 서버는 무시) */
function fireRefresh(){ try{ if(SUBMIT_URL) fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({_kind:'refresh'})}).catch(()=>{}); }catch(e){} }
function linkKey(){return ({'1_new':'n1','1_hm':'h1','2_new':'n2','2_hm':'h2'})[state.key]||'';}
function sheetNameFor(key){
  return {'1_new':'1차_입사자','1_hm':'1차_HM','2_new':'2차_입사자','2_hm':'2차_HM'}[key];
}
function buildRecord(){
  const s=SURVEYS[state.key],p=state.profile;
  const author=p.name||(s.dual?state.answers.signHM:'')||'';
  const rec={제출시각:new Date().toLocaleString('ko-KR'),
    차수:s.round,진단시점:s.roundTag,역할:s.role,소속:p.dept,작성자:author,대상자:p.target||'',입사일:p.hire};
  if(s.dual){
    const hasIn=state.selfIn&&state.selfIn.s;
    s.items.forEach((it,i)=>{
      rec[`${i+1}.${it.t}(자가점검)`]= hasIn ? (state.selfIn.s[i]||'') : (state.answers['self'+i]||'');
      rec[`${i+1}.${it.t}(팀장피드백)`]=state.answers['fb'+i]||'';
    });
    rec['면담일']=state.answers.meetDate||'';rec['입사자서명']=state.answers.signNew||'';rec['팀장서명']=state.answers.signHM||'';
  }else{
    let n=0;s.themes.forEach(th=>th.q.forEach(q=>{n++;rec[`Q${n}. ${q.text}`]=state.answers['q'+n]??'';   /* 질문 전체를 그대로 머리글로 보낸다(서버가 Q번호로 열을 찾음) */}));
    let sum=0,c=0;n=0;s.themes.forEach(th=>th.q.forEach(q=>{n++;if(q.t==='L'){sum+=Number(state.answers['q'+n]);c++;}}));
    rec['리커트평균']=c?(sum/c).toFixed(2):'';
    if(s.selfCheck){SELF_ITEMS.forEach((it,i)=>{rec[`자가점검_${it.t}`]=state.answers['sc'+i]||'';});}
  }
  return rec;
}
function fileLabel(rec){const who=rec.대상자||rec.작성자||'응답';return `[온보딩응답] ${rec.차수}_${rec.역할}_${who}`.replace(/[\\/:*?"<>|]/g,'');}
function downloadJSON(rec){
  const blob=new Blob([JSON.stringify(rec,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileLabel(rec)+'.json';a.click();
}
function makeCode(rec){return 'HRONB1:'+btoa(unescape(encodeURIComponent(JSON.stringify(rec))));}
function b64urlEnc(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64urlDec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function makeSelfPayload(){
  const p=state.profile;
  const out={p:{name:p.name,cl:p.cl,hire:p.hire,dept:p.dept}, s:SELF_ITEMS.map((_,i)=>state.answers['sc'+i]||'')};
  if(state.hmPre&&(state.hmPre.name||state.hmPre.dept)) out.h={name:state.hmPre.name||'',dept:state.hmPre.dept||''};   /* 팀장 소속/성명 자동 입력용 */
  return out;
}
/* 자가점검 데이터를 URL에 통째로 담으면(예전 sc= 방식) 메신저/메일 앱이 링크를 중간에서 잘라
   먹어 "클릭하면 코드 입력 화면"으로 떨어지는 문제가 있었다. 서버(_pending_approval 시트)에
   짧은 코드로 저장해두고 링크에는 그 코드만 실어 보내 이 문제를 없앤다. */
function ensureSelfHandoffCode(){

/* 링크 복사: 클립보드 API가 막힌 환경에서는 예전 방식으로 한 번 더 시도하고, 그래도 안 되면 링크를 선택해 둔 채 안내한다(조용히 실패하지 않음) */
function copyLinkText(text,inputEl,btn){
  const flash=msg=>{ if(!btn)return; const o=btn.dataset.o||btn.textContent; btn.dataset.o=o; btn.textContent=msg; setTimeout(()=>{btn.textContent=o;},1800); };
  const legacy=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
      const r=document.execCommand('copy'); document.body.removeChild(ta);
      if(r){ flash('복사됨 \u2713'); return; }
    }catch(e){}
    if(inputEl){ inputEl.focus(); inputEl.select(); }
    flash('Ctrl+C로 복사하세요');
  };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>flash('복사됨 \u2713')).catch(legacy); } else legacy();
}
function copyFrom(id,btn){const t=document.getElementById(id);copyLinkText(t.value,t,btn);}
function nextStepHTML(){

function copyCode(){const t=document.getElementById('codeBox');t.select();try{document.execCommand('copy');}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(t.value).catch(()=>{});const b=event.target;const o=b.textContent;b.textContent='복사됨 ✓';setTimeout(()=>b.textContent=o,1500);}
function applySelfIn(selfIn){
  state.selfIn=selfIn;
  const p=selfIn.p||{};
  if(p.name){state.profile.target=p.name;state.locked.target=true;}
  if(p.cl){state.profile.cl=p.cl;state.locked.cl=true;}
  if(p.hire){state.profile.hire=p.hire;state.locked.hire=true;}
  const h=selfIn.h||{};
  if(h.name&&!state.profile.name)state.profile.name=h.name;       /* 팀장 본인 성명 자동 입력(수정 가능) */
  if(h.dept&&!state.profile.dept)state.profile.dept=h.dept;
  if(p.dept&&!state.profile.dept)state.profile.dept=p.dept;
}
/* 링크에 차수·역할·핵심 인적사항이 모두 담겨 있으면, 선택 화면 없이 곧바로 설문으로 진입한다.
   입사자 자가점검 핸드오프로 들어온 팀장은 아직 본인 성명을 안 적었으므로 이름은 요구하지 않는다
   (면담 확인 단계의 팀장 서명으로 나중에 채워짐). scref 코드 조회가 끝난 뒤에도 호출되므로
   initParams()에서 분리해 두었다. */
function finalizeEntry(){
  if(state.round && state.role){
    const p=state.profile;
    const need=[p.dept,p.hire];
    if(!state.selfIn) need.push(p.name);
    if(state.role==='hm')need.push(p.target);
    if(!need.some(x=>!x)){ state.answers=Object.assign({},state.prevAnswers); state.step='survey'; }
  }
}
function initParams(){
  try{
    const q=new URLSearchParams(location.search);
    const r=q.get('round'); if(r==='1'||r==='2')state.round=r;
    const ro=q.get('role'); if(ro==='new'||ro==='hm')state.role=ro;
    syncKey();
    ['dept','name','target','cl','hire'].forEach(k=>{const v=q.get(k); if(v)state.profile[k]=v;});
    const code=q.get('code'); if(code)state.linkCode=code;
    const me=q.get('me'); if(me)state.me=me.trim();
    /* 팀장 화면: 링크로 받은 입사자 정보(성명/입사일/직급)는 팀장이 바꿀 수 없게 잠근다. 계약직 표기는 누구도 바꿀 수 없다. */
    if(state.role==='hm'){ ['target','hire','cl'].forEach(k=>{ if(state.profile[k]) state.locked[k]=true; }); }
    if(state.profile.cl==='계약직') state.locked.cl=true;
    /* 예전 링크 호환: role=hm인데 name 대신 hm 파라미터로 팀장명을 보낸 경우 */
    if(state.role==='hm' && !state.profile.name){ const hmName=q.get('hm'); if(hmName)state.profile.name=hmName; }
    /* 2차 입사자 링크에 팀장 정보(hm, hmdept)가 있으면 자가점검 전달 때 함께 실어, 팀장이 소속/성명을 다시 쓰지 않게 한다 */
    if(state.role==='new'){ const hn=q.get('hm'), hd=q.get('hmdept'); if(hn||hd) state.hmPre={name:hn||'',dept:hd||''}; }
    /* 새 방식: 자가점검 데이터를 서버에 저장하고 짧은 코드만 링크에 담는다(scref).
       메신저/메일이 긴 링크를 잘라먹어도 안전하다. 조회는 비동기라 아래 부트스트랩에서 처리. */
    const scRef=q.get('scref'); if(scRef)state.scRefCode=scRef;
    /* 예전 방식 호환: 자가점검 데이터를 통째로 담은 sc= 링크도 계속 지원 */
    const scM=location.search.match(/[?&]sc=([^&]*)/);
    if(scM){ try{
      const sc=decodeURIComponent(scM[1]);
      applySelfIn(JSON.parse(b64urlDec(sc)));
    }catch(e){} }
    if(!state.scRefCode) finalizeEntry();
  }catch(e){}
}
/* scref 코드로 서버(_pending_approval 시트)에서 자가점검 데이터를 조회한다(JSONP). */
function loadSelfRef(code,done){
  let finished=false;
  const finish=()=>{ if(finished)return; finished=true; done(); };
  window.__selfRefCb=(resp)=>{
    if(resp && resp.ok && resp.data && resp.data.status==='done'){ state.alreadyDone=true; }
    else if(resp && resp.ok && resp.data && resp.data.teamLead){ try{ applySelfIn(resp.data.teamLead); }catch(e){} }
    finish();
  };
  const s=document.createElement('script');
  s.src=SUBMIT_URL+'?action=getPending&code='+encodeURIComponent(code)+'&callback=__selfRefCb&_='+Date.now();
  s.onerror=finish;
  document.body.appendChild(s);
  setTimeout(finish, 10000);   /* 서버 응답이 2~3초 걸려서 3초는 부족했음(입사자 자가점검이 빈 채로 열리는 원인) */
}
/* 2차 팀장 링크(code=2H-...)로 들어오면 입사자 자가점검을 시트에서 직접 읽어 온다(예전처럼 입사자가 전달하는 링크가 필요 없음).
   입사자가 아직 제출 전이면 기다리는 화면, 불러오지 못하면 안내 화면(빈 자가점검으로 열리지 않게). */
function loadSelfDirect(code,done){
  /* 서버 응답이 간헐적으로 10초 이상(최대 1분 넘게) 걸리는 경우가 있어, 한 번에 길게 기다리고 오류가 나면 한 번 더 시도한다.
     먼저 도착한 정상 응답을 쓰고, 두 번 다 실패했을 때만 실패 화면으로 보낸다. */
  let finished=false,attempt=0;
  const finish=()=>{ if(finished)return; finished=true; done(); };
  const handle=(resp)=>{
    if(finished)return;
    const d=resp&&resp.ok&&resp.data;
    if(!d){ state.selfStatus='fail'; }
    else if(d.status==='ready'){ try{ applySelfIn({p:{name:d.name||state.profile.target},s:d.s}); }catch(e){} state.selfStatus='ready'; }
    else if(d.status==='done'){ state.selfStatus='done'; }
    else { state.selfStatus='wait'; }
    finish();
  };
  const retryOrFail=()=>{ if(finished)return; if(attempt<2) send(); else { state.selfStatus='fail'; finish(); } };
  const send=()=>{
    attempt++;
    const cb='__selfDirCb'+attempt;
    window[cb]=handle;
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=getSelf&code='+encodeURIComponent(code)+'&callback='+cb+'&_='+Date.now();
    s.onerror=()=>{ setTimeout(retryOrFail,1500); };
    document.body.appendChild(s);
    setTimeout(retryOrFail, attempt===1?35000:40000);
  };
  send();
}
/* 링크 잠금 여부 확인(HR이 시트 '_link_status' 상태 열을 closed로 바꾸면 접근 차단).
   code 파라미터가 없거나 SUBMIT_URL 미설정이면 검사 없이 통과(fail-open). */
const LINK={started:false,released:false,result:null,okAt:0,waiters:[]};
/* 링크 확인을 기다렸다가 화면을 열지(true), 화면을 먼저 열고 뒤에서 확인할지(false).
   false면 진입이 서버 응답(평소 2~4초, 느리면 10초 이상)을 기다리지 않는다. 닫힘/제출 완료 응답이 오면 그때 해당 화면으로 바뀌고,
   제출 직전에도 최근 확인 결과가 없으면 한 번 더 확인하므로 닫힌 링크로 제출되지는 않는다. 예전 방식으로 되돌리려면 true. */
const LINK_BLOCKING=false;
function startLinkCheck(code){   /* 요청은 한 번만 보낸다. 팀장 2차 링크는 자가점검 조회와 동시에 미리 보내 대기 시간을 겹친다 */
  if(LINK.started)return; LINK.started=true;
  const release=()=>{ if(LINK.released)return; LINK.released=true; LINK.waiters.splice(0).forEach(f=>f()); };
  window.__linkStatusCb=(resp)=>{
    if(resp && resp.ok && resp.redo){ state.redo=true; loadPrev(); }   /* HR이 재작성으로 다시 열어 준 단계: 이전에 제출한 내용을 채워 연다 */
    const closed=!!(resp && resp.ok && resp.status==='closed');
    const doneAlready=!!(resp && resp.ok && !closed && resp.done);
    if(resp && resp.ok && !closed && !doneAlready) LINK.okAt=Date.now();   /* 제출 직전 재확인을 생략해도 되는지 판단하는 기준 시각 */
    if(closed||doneAlready){
      LINK.result=closed?'closed':'alreadyDone';   /* 이미 제출이 끝난 단계는 내용은 보여 주지 않고 안내만 */
      state.step=LINK.result;
      if(LINK.released) render();   /* 늦게 도착한 닫힘/완료 응답도 반영 */
    }
    release();
  };
  const s=document.createElement('script');
  s.src=SUBMIT_URL+'?action=checkLink&code='+encodeURIComponent(code)+'&k='+encodeURIComponent(linkKey())+'&hire='+encodeURIComponent(state.profile.hire||'')+'&callback=__linkStatusCb&_='+Date.now();
  s.onerror=release;
  document.body.appendChild(s);
  setTimeout(release, 20000); // 서버 응답이 보통 2~3초(느리면 10초 이상)라 넉넉히 기다린 뒤에도 안 오면 막지 않고 통과
}
/* ===== 재작성(HR이 _link_status 메모에 '재작성'을 적어 다시 연 단계): 이전에 제출한 내용을 채워서 보여 준다 ===== */
function applyPrev(d){
  const put=(k,v)=>{ if(v===undefined||v===null||v==='')return; state.prevAnswers[k]=v; if(state.answers[k]===undefined||state.answers[k]==='')state.answers[k]=v; };
  Object.keys(d.ans||{}).forEach(k=>put(k,d.ans[k]));
  (d.sc||[]).forEach((v,i)=>put('sc'+i,v));
  (d.fb||[]).forEach((v,i)=>put('fb'+i,v));
  put('meetDate',d.meet); put('signHM',d.signHM);
  if(state.role==='hm' && d.prof){ if(d.prof.dept)state.profile.dept=d.prof.dept; if(d.prof.name)state.profile.name=d.prof.name; }
  if(state.step==='survey') render();
}
function loadPrev(){
  if(state.prevAsked||!SUBMIT_URL||!state.linkCode)return; state.prevAsked=true;
  if(state.step==='survey') render();   /* 안내 문구를 먼저 보여 준다 */
  let tries=0;
  const send=()=>{
    tries++;
    const cb='__prevCb'+tries; window[cb]=resp=>{ if(resp&&resp.ok&&resp.data) applyPrev(resp.data); };
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=getResponse&code='+encodeURIComponent(state.linkCode)+'&k='+encodeURIComponent(linkKey())+'&callback='+cb+'&_='+Date.now();
    s.onerror=()=>{ if(tries<2) setTimeout(send,1500); };
    document.body.appendChild(s);
  };
  send();
}
function checkLinkStatus(code, done){
  startLinkCheck(code);
  if(LINK.released) done(); else LINK.waiters.push(done);
}
function bootAfterSelfRef(){
  if(state.alreadyDone){ state.step='alreadyDone'; render(); return; }
  if(state.linkCode && SUBMIT_URL){
    const resolvedStep=state.step;
    if(!LINK_BLOCKING){
      startLinkCheck(state.linkCode);
      state.step=LINK.result||resolvedStep; LINK.released=true;   /* released: 늦게 오는 닫힘/완료 응답이 화면을 바꾸도록 */
      render(); return;
    }
    state.step='checking'; render();
    checkLinkStatus(state.linkCode, ()=>{ state.step=LINK.result||resolvedStep; render(); });
  }else{
    render();
  }
}
/* ===== 내가 할 일 연동(링크에 me= 토큰이 있을 때만 동작). onboarding_survey.html, executive_approval.html 두 화면에 같은 코드를 둔다 =====
   - 제출 직후 화면에 "남은 단계"와 바로가기를 보여 준다(서버가 응답 시트로 계산).
   - 제출이 다음 사람의 단계를 여는 경우(입사자 2차 -> 팀장, 팀장 평가 -> 임원), 그 사람에게 보낼 완료 메일(.eml)을 만들어 준다. */
const MT={me:'',k:'',code:'',who:'',tasks:null,sent:false};
const MT_TITLE={
  n1:t=>'1차 채용 Quality 진단',
  h1:t=>'1차 채용 Quality 평가: '+t.who+'님',
  n2:t=>'2차 온보딩 적응 진단(자가점검)',
  h2:t=>'2차 자가점검 피드백 작성: '+t.who+'님',

};
const MT_WAIT={
  h2:t=>t.who+'님이 자가점검을 제출하면 자동으로 열립니다',
  exec:t=>'팀장님의 평가가 끝나면 열리고, 팀장님이 열렸다고 안내해 주십니다'
};
const mtWD=['일','월','화','수','목','금','토'];
function mtEsc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function mtToday(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function mtDstr(iso){const d=new Date(iso+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+' ('+mtWD[d.getDay()]+')';}
function mtDleft(due){return Math.round((new Date(due+'T00:00:00')-new Date(mtToday()+'T00:00:00'))/86400000);}
function mtHasDue(t){return /^\d{4}-\d{2}-\d{2}$/.test(t.due||'');}
function mtUrgent(t){return t.st!=='done'&&mtHasDue(t)&&mtDleft(t.due)<=3;}
function mtDueTxt(t){if(!mtHasDue(t))return '';const d=mtDleft(t.due);return d<0?mtDstr(t.due)+' 마감 지남':d===0?mtDstr(t.due)+' 오늘 마감':mtDstr(t.due)+' 마감 D-'+d;}
function mtHubUrl(){return location.origin+location.pathname.replace(/[^\/]*$/,'')+'my_tasks.html?me='+encodeURIComponent(MT.me);}
function mtToast(m){
  let t=document.getElementById('mtoast');
  if(!t){t=document.createElement('div');t.id='mtoast';t.className='mtoast';document.body.appendChild(t);}
  t.textContent=m;t.classList.add('show');clearTimeout(mtToast._t);mtToast._t=setTimeout(()=>t.classList.remove('show'),3600);
}
function mtFetch(cb,me){
  /* 서버가 간헐적으로 10초에서 1분 넘게 걸려서 길게 기다리고, 오류나 시간 초과면 한 번 더 시도한다(먼저 온 정상 응답을 사용) */
  let finished=false,attempt=0;const fin=r=>{if(finished)return;finished=true;cb(r);};
  const who=me||MT.me;
  const retryOrFail=()=>{if(finished)return;if(attempt<2)send();else fin(null);};
  const send=()=>{
    attempt++;
    const name='__mtd'+Date.now()+Math.floor(Math.random()*1000);
    window[name]=r=>fin(r);
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=myTasks&me='+encodeURIComponent(who)+'&callback='+name+'&_='+Date.now();
    s.onerror=()=>{setTimeout(retryOrFail,1500);};document.body.appendChild(s);
    setTimeout(retryOrFail,attempt===1?35000:40000);
  };
  send();

/* 단계 목록을 미리 받아 둔다(페이지를 연 뒤 잠시 있다가 한 번). 제출 직후 서버가 느려도 남은 단계를 바로 보여 주기 위함이며, 제출 직후에 한 번 더 받아 바뀐 것만 반영한다 */
const MTPRE={started:false,done:false,r:null,cbs:[]};
function mtPrefetch(me){

  mtFetch(r=>{MTPRE.done=true;MTPRE.r=(r&&r.ok&&r.data)?r:null;MTPRE.cbs.splice(0).forEach(f=>f(MTPRE.r));},me);
}
function mtCard(t,num,primary){
  const no='<div class="no">'+num+'</div>',title=mtEsc((MT_TITLE[t.k]||(()=>t.k))(t));
  const hot=mtUrgent(t),due=mtDueTxt(t),chip=due?'<span class="chip '+(hot?'hot':'due')+'">'+mtEsc(due)+'</span>':'';
  if(t.st==='done')return '<div class="t dn">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta"><span class="chip dn">완료</span>제출한 내용은 다시 볼 수 없어요</div></div></div>';
  if(t.st==='wait')return '<div class="t wait">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta"><span class="chip wt">대기 중</span>'+chip+'<br>'+mtEsc((MT_WAIT[t.k]||(()=>''))(t))+'</div></div><div class="act"><button class="btn primary sm" disabled>아직 열리지 않았어요</button></div></div>';
  return '<div class="t">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta">'+(t.redo?'<span class="chip due">다시 작성 요청</span>':'<span class="chip go">지금 할 수 있어요</span>')+chip+'</div></div>'+
    '<div class="act">'+(t.url?'<a class="btn link sm '+(hot?'red':primary?'primary':'ghost')+'" href="'+mtEsc(t.url)+'">바로 작성하기</a>':'<button class="btn primary sm" disabled>링크 준비 중</button>')+'</div></div>';
}
function mtGroup(label,list,sub,first){
  if(!list.length)return '';
  return '<div class="grp"><h3>'+label+' ('+list.length+')</h3>'+(sub?'<p class="gsub">'+sub+'</p>':'')+list.map((t,j)=>mtCard(t,j+1,!!first&&j===0)).join('')+'</div>';

function mtGroups(list){
  const todo=list.filter(t=>t.st==='todo').map((t,i)=>[t,i]).sort((a,b)=>(mtUrgent(b[0])-mtUrgent(a[0]))||(a[1]-b[1])).map(x=>x[0]);
  return mtGroup('지금 할 수 있는 단계',todo,'',true)+mtGroup('아직 열리지 않은 단계',list.filter(t=>t.st==='wait'),'앞 단계가 끝나면 자동으로 열려요. 내가 할 일 페이지를 열어 두면 30초마다 자동으로 확인해요.',false);
}
function mtAlert(list){
  const open=list.filter(t=>t.st!=='done'&&mtHasDue(t));
  const today=open.filter(t=>mtDleft(t.due)<=0).length,soon=open.filter(t=>mtDleft(t.due)>0&&mtDleft(t.due)<=3).length;
  if(!today&&!soon)return '';
  const parts=[];if(today)parts.push('오늘 마감 '+today+'건');if(soon)parts.push('마감 임박 '+soon+'건');
  return '<div class="alert"><b>'+parts.join(', ')+'</b><br>마감일이 지나면 링크가 닫힙니다. 빨간색으로 표시된 단계를 먼저 진행해 주세요.</div>';

/* ----- 다음 사람에게 보내는 완료 메일: 서식 있는 한 통(.eml)을 내려받아 열면 PC의 Outlook 작성창이 열린다 ----- */
const MT_FALLBACK='위 페이지에서 열리지 않는다면 아래 링크로 접속하세요.';
function mtOpenLine(N){return N.to+(N.redo?', 온보딩 점검 진단 평가를 수정하여 다시 전달 드립니다. 아래 링크 접속하시면 ':', 온보딩 점검 진단 평가 완료하여 전달 드립니다. 아래 링크 접속하시면 ')+N.act+' 진행하실 수 있습니다.';}
function mtNotifyOf(task){
  if(!task||!task.next)return null;
  const who=task.who||MT.who,n=task.next,re=!!MT.redo;   /* 재작성 제출이면 '열렸습니다' 대신 '수정본 제출' 문구 */
  if(task.k==='n2'&&re)return {redo:true,head:'자가점검 수정본이 제출되었습니다!',to:n.to,act:'수정된 내용을 확인하고 피드백을',what:who+'님의 2차 자가점검이 수정되어 다시 제출되었습니다.',hub:n.hub,direct:n.direct,subj:'(온보딩 점검 진단) '+who+'님 자가점검 수정본 제출, 내용을 확인해 주세요!'};
  if(task.k==='cats'&&re)return {redo:true,head:'팀장 평가 수정본이 제출되었습니다!',to:n.to,act:'수정된 내용을 확인하고 결재를',what:who+'님의 팀장 평가가 수정되어 다시 제출되었습니다.',hub:n.hub,direct:n.direct,subj:'(온보딩 점검 진단) '+who+'님 팀장 평가 수정본 제출, 내용을 확인해 주세요!'};
  if(task.k==='n2')return {head:'내가 해야 할 일에 링크가 열렸습니다!',to:n.to,act:'피드백 작성을',what:who+'님의 2차 자가점검이 제출되어 피드백 단계가 열렸습니다.',hub:n.hub,direct:n.direct,subj:'(온보딩 점검 진단) '+who+'님 자가점검 완료, 내가 해야 할 일에 피드백 단계가 열렸습니다!'};
  if(task.k==='cats')return {head:'내가 해야 할 일에 링크가 열렸습니다!',to:n.to,act:'결재를',what:who+'님의 팀장 평가가 완료되어 결재 단계가 열렸습니다.',hub:n.hub,direct:n.direct,subj:'(온보딩 점검 진단) '+who+'님 팀장 평가 완료, 내가 해야 할 일에 결재 단계가 열렸습니다!'};
  return null;
}
/* 미리보기와 실제 메일이 같은 서식이 되도록 한 함수로 만든다. Outlook(Word 엔진)에서도 깨지지 않게 표와 인라인 스타일만 쓴다 */
function mtMailHTML(N){
  const F='font-family:\'맑은 고딕\',Malgun Gothic,sans-serif;',E=mtEsc;
  return '<div style="'+F+'font-size:10.5pt;line-height:1.7;color:#1a2230">'+
    '<p style="'+F+'margin:0 0 16px;font-size:11pt;color:#1a2230">'+E(mtOpenLine(N))+'</p>'+
    '<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="'+F+'border-collapse:collapse;width:640px;max-width:100%;border:1px solid #e3e7ee;background:#ffffff">'+
    '<tr><td style="'+F+'padding:22px 26px 0"><table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>'+
      '<td width="30" height="30" align="center" bgcolor="#1F6FEB" style="'+F+'background:#1F6FEB;color:#ffffff;font-weight:bold;font-size:9.5pt;width:30px;height:30px">HR</td>'+
      '<td style="padding-left:10px;'+F+'"><div style="'+F+'font-size:11pt;font-weight:bold;color:#1a2230;line-height:1.3">경력사원 온보딩 진단</div><div style="'+F+'font-size:8.5pt;color:#4a556a;line-height:1.3">인재개발팀 &middot; Talent Development</div></td>'+
    '</tr></table></td></tr>'+
    '<tr><td style="'+F+'padding:20px 26px 4px"><div style="'+F+'font-size:17pt;font-weight:bold;color:#1a2230;line-height:1.4">'+E(N.to)+', '+E(N.head)+'</div></td></tr>'+
    '<tr><td style="'+F+'padding:10px 26px 4px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>'+
      '<td width="6" bgcolor="#1F6FEB" style="'+F+'background:#1F6FEB;width:6px;font-size:1px">&nbsp;</td>'+
      '<td bgcolor="#EAF1FE" style="'+F+'background:#EAF1FE;padding:16px 18px">'+
        '<div style="'+F+'font-size:10.5pt;color:#4a556a;margin:0 0 12px">'+E(N.what)+'</div>'+
        '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr><td bgcolor="#1F6FEB" style="'+F+'background:#1F6FEB;padding:10px 22px"><a href="'+E(N.hub)+'" style="'+F+'color:#ffffff;font-weight:bold;text-decoration:none;font-size:10.5pt">내가 할 일 열기</a></td></tr></table>'+
      '</td></tr></table></td></tr>'+
    '<tr><td style="'+F+'padding:16px 26px 22px;font-size:9.5pt;color:#4a556a">&#8251; '+E(MT_FALLBACK)+' <a href="'+E(N.direct)+'" style="color:#1F6FEB;font-weight:bold;text-decoration:underline">바로가기</a></td></tr>'+
    '</table></div>';
}
function mtMailPlain(N){return mtOpenLine(N)+'\n\n'+N.to+', '+N.head+'\n'+N.what+'\n\n내가 할 일 열기: '+N.hub+'\n\n※ '+MT_FALLBACK+'\n바로가기: '+N.direct;}
function mtB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function mtMakeEml(N){
  const wrap=s=>s.replace(/(.{76})/g,'$1\r\n');
  return 'X-Unsent: 1\r\nSubject: =?UTF-8?B?'+mtB64(N.subj)+'?=\r\nMIME-Version: 1.0\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap(mtB64(mtMailHTML(N)))+'\r\n';
}
function mtNotify(){return MT._notify||null;}
function mtDownloadEml(){
  const N=mtNotify();if(!N)return;
  const blob=new Blob([mtMakeEml(N)],{type:'message/rfc822'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='온보딩점검_완료안내.eml';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  mtToast('내려받은 "온보딩점검_완료안내" 파일을 열면 Outlook 메일 작성창이 열립니다. 받는 사람만 선택해 보내세요.');
}
function mtCopyPlain(text,msg){
  const ok=()=>mtToast(msg);
  const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();const r=document.execCommand('copy');document.body.removeChild(ta);if(r){ok();return;}}catch(e){}mtToast('자동 복사가 막혀 있어요. 미리보기 내용을 직접 선택해 복사해 주세요.');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok).catch(legacy);}else legacy();
}
function mtCopyRich(){
  const N=mtNotify();if(!N)return;
  const html=mtMailHTML(N),plain=mtMailPlain(N);
  if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]).then(()=>mtToast('서식 그대로 복사했습니다. 새 메일 본문에 붙여넣으세요.')).catch(()=>mtCopyPlain(plain,'메일 내용을 복사했습니다. 새 메일 본문에 붙여넣으세요.'));
  }else mtCopyPlain(plain,'메일 내용을 복사했습니다. 새 메일 본문에 붙여넣으세요.');
}
function mtNotifyBox(N){
  return '<div class="box"><h3>'+mtEsc(N.to)+'께 완료 메일을 보내 주세요</h3>'+
    '<p class="lead">'+mtEsc(N.to)+(N.redo?'의 <b>내가 할 일</b> 페이지에는 해당 단계가 <b>이미 열려 있습니다.</b> 수정본이 제출되었다는 안내만 보내 주세요.<br><span class="mtone">메일 한 통에 수정본 제출 안내와, 그 페이지에서 열리지 않을 때 쓰는 바로가기 링크가 함께 들어갑니다.</span></p>':'의 <b>내가 할 일</b> 페이지에 다음 단계가 <b>자동으로 열렸습니다.</b><br><span class="mtone">메일 한 통에 열렸다는 안내와, 그 페이지에서 열리지 않을 때 쓰는 바로가기 링크가 함께 들어갑니다.</span></p>')+
    '<div class="act"><button class="btn primary" onclick="mtDownloadEml()">완료 메일 작성</button><button class="btn ghost" onclick="mtCopyRich()">메일 내용 복사</button></div>'+
    '<ul class="mtnote"><li>"완료 메일 작성" 버튼을 눌러서 다운된 파일을 여세요. 아래 내용이 자동으로 채워진 Outlook으로 연결됩니다.<br>(Chrome은 다운로드 표시줄, Edge는 다운로드 창에서 파일 열기)</li><li>또는 "메일 내용 복사"를 클릭하여 직접 복사-붙여넣기 하셔도 됩니다.</li></ul>'+
    '<div class="sub2"><b>보내지는 메일 미리보기</b><div class="pv"><div class="pvsub"><b>제목</b> '+mtEsc(N.subj)+'</div><div class="pvbody">'+mtMailHTML(N)+'</div></div></div></div>';
}

/* 제출이 끝난 직후 호출: 남은 단계와 완료 메일을 #mtExtra에 채운다. 응답이 없으면 내가 할 일 링크만 안내한다. */
/* 허브가 링크에 실어 준 다음 사람 정보(nxto, nxhub, nxd). 없으면 null */
function mtNxFromUrl(){
  try{const q=new URLSearchParams(location.search),to=q.get('nxto'),hub=q.get('nxhub'),d=q.get('nxd');return(to&&(hub||d))?{to:to,hub:hub||'',direct:d||''}:null;}catch(e){return null;}
}
function mtAfterDone(){
  const box=document.getElementById('mtExtra');
  if(!box||!MT.me)return;
  const hub=mtHubUrl();
  let shown=false;
  const NX=mtNxFromUrl(),earlyN=NX?mtNotifyOf({k:MT.k,who:MT.who,next:NX}):null;   /* 서버 응답 없이도 완료 메일 박스를 먼저 보여 준다 */
  MT._notify=earlyN;
  const early=()=>earlyN?mtNotifyBox(earlyN):'';
  box.innerHTML=early()+'<div class="box"><p class="lead" style="margin:0">다음 단계를 확인하고 있어요... 서버가 바쁠 때는 1분 정도 걸릴 수 있어요.</p><p class="foot" style="margin:8px 0 0">기다리지 않고 <a href="'+mtEsc(hub)+'">내가 할 일</a> 페이지에서 바로 확인하셔도 됩니다.</p></div>';
  const fail=()=>{box.innerHTML=early()+'<div class="box"><p class="lead" style="margin:0 0 12px">다음 단계를 아직 불러오지 못했어요. 서버가 바쁜 것 같아요.</p><div class="mini-actions"><button class="btn ghost sm" onclick="mtAfterDone()">다시 불러오기</button><a class="btn primary sm link" href="'+mtEsc(hub)+'">내가 할 일에서 확인</a></div></div>';};
  const prep=(r)=>{
    const tasks=r.data.tasks;
    let mine=null;
    tasks.forEach(t=>{if(t.k===MT.k&&(!MT.code||t.code===MT.code)){t.st='done';mine=t;}});   /* 방금 낸 단계는 서버 반영이 늦어도 완료로 표시 */
    return {tasks:tasks,mine:mine,sig:tasks.map(t=>t.k+'|'+t.code+'|'+t.st).join(',')};
  };
  const show=(P)=>{
    const tasks=P.tasks;
    MT.tasks=tasks;MT._sig=P.sig;shown=true;
    const N=(mtNotifyOf(P.mine)||earlyN);MT._notify=N;
    const rest=tasks.filter(t=>t.st!=='done'),n=tasks.length,dn=n-rest.length;
    let h=N?mtNotifyBox(N):'';
    if(rest.length){
      h+='<div class="box"><h3>남은 단계가 '+rest.length+'개 있어요</h3><p class="lead">아래 버튼으로 바로 이어서 진행할 수 있어요.</p>'+mtAlert(rest)+
        '<div class="pg"><span>전체 '+n+'단계 중 '+dn+'단계 완료</span><div class="bar"><i style="width:'+Math.round(dn/n*100)+'%"></i></div></div>'+
        mtGroups(rest)+'<p class="foot">전체 현황은 <a href="'+mtEsc(hub)+'">내가 할 일</a> 페이지에서 언제든 확인할 수 있어요.</p></div>';
    }else{
      h+='<div class="box ok"><h3>모든 단계를 마쳤습니다</h3><p class="lead" style="margin-bottom:0">추가로 하실 일은 없습니다. 수고하셨습니다.</p></div>';
    }
    box.innerHTML=h;
  };
  /* 미리 받아 둔 목록이 있으면 바로 보여 주고, 최신 목록은 뒤에서 받아 달라진 때만 다시 그린다 */
  const fresh=()=>mtFetch(r=>{
    if(r&&r.ok&&r.data){const P=prep(r);if(!shown||P.sig!==MT._sig)show(P);}
    else if(!shown)fail();
  });
  if(MTPRE.done&&MTPRE.r){show(prep(MTPRE.r));fresh();}
  else if(MTPRE.started&&!MTPRE.done){MTPRE.cbs.push(r=>{if(r)show(prep(r));fresh();});}
  else fresh();
}

initParams();
setTimeout(()=>mtPrefetch(state.me),20000);   /* 제출 직후 남은 단계를 바로 보여 주기 위해 미리 받아 둠 */
if(state.role==='hm' && state.round==='2' && /^2H-/.test(state.linkCode||'') && SUBMIT_URL && !state.scRefCode){
  state.step='checking'; render();
  startLinkCheck(state.linkCode);   /* 링크 확인은 자가점검 조회와 동시에 보낸다(순서대로 보내면 두 번 기다림) */
  loadSelfDirect(state.linkCode, ()=>{
    finalizeEntry();
    if(state.selfStatus==='done') state.alreadyDone=true;
    else if(state.selfStatus==='wait') state.step='waitSelf';
    else if(state.selfStatus==='fail') state.step='selfFail';
    bootAfterSelfRef();
  });
}else if(state.scRefCode && SUBMIT_URL){
  state.step='checking'; render();
  loadSelfRef(state.scRefCode, ()=>{ finalizeEntry(); bootAfterSelfRef(); });
}else{
  bootAfterSelfRef();
}
</script>
</body>
</html>
