<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 진단 — 예비 취합기</title>
<style>
  :root{--navy:#0F2A4A;--blue:#2E5AA8;--bg:#F4F6FA;--card:#fff;--line:#E2E7F0;--text:#1C2733;--sub:#5B6B7F;--ok:#1E7A46;--err:#B23B3B}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--text);line-height:1.6;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  .hero{background:linear-gradient(135deg,var(--navy),#173B66);color:#fff;padding:28px 26px;margin-bottom:20px}
  .hero h1{margin:0 0 4px;font-size:20px;font-weight:800}
  .hero p{margin:0;font-size:13px;opacity:.9}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:14px;color:var(--navy);margin:0 0 10px}
  textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
  textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px;font-weight:800}
  button.primary{background:var(--navy);color:#fff}
  button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:700}
  .msg{margin-top:12px;padding:11px 14px;border-radius:8px;font-size:13px;display:none}
  .msg.show{display:block}
  .msg.ok{background:#E7F4EC;color:var(--ok);border:1px solid #B5DCC4}
  .msg.err{background:#FBECEC;color:var(--err);border:1px solid #E7C3C3}
  .out{margin-top:12px}
  .out .tab{display:inline-block;background:#EEF2FA;color:var(--blue);font-weight:700;font-size:12px;padding:2px 10px;border-radius:20px;margin-bottom:6px}
  pre{background:#0F2A4A;color:#EAF0FB;padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:12px;white-space:pre;margin:0}
  .hint{font-size:12px;color:var(--sub);margin:6px 0 0}
  code{background:#EEF2FA;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>온보딩 진단 — 예비 취합기</h1>
    <p>설문/결재 화면에서 “자동 전송 실패”가 뜬 경우, 표시된 JSON을 여기에 붙여넣어 ① 재전송 하거나 ② 구글 시트에 바로 붙여넣을 행(TSV)을 만듭니다.</p>
  </div>

  <div class="card">
    <h2>1. JSON 붙여넣기</h2>
    <textarea id="in" placeholder='설문 화면의 "JSON 복사" 버튼으로 복사한 내용을 그대로 붙여넣으세요'></textarea>
    <div class="actions">
      <button class="primary" id="btnSend">Apps Script로 재전송</button>
      <button class="ghost" id="btnTsv">시트 붙여넣기용 행(TSV) 생성</button>
    </div>
    <p class="hint">재전송 URL: <code id="urlShow">MY_WEB_APP_URL</code></p>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card out" id="outCard" style="display:none">
    <h2>2. 구글 시트 붙여넣기</h2>
    <p class="hint">아래 <b>탭</b>을 열고, 마지막 데이터 행 <b>바로 아래 A열 셀</b>을 선택한 뒤 붙여넣기(Ctrl+V) 하세요. 열 순서는 기존 구조와 동일합니다.</p>
    <div class="out"><span class="tab" id="outTab"></span><pre id="outRow"></pre></div>
    <div class="actions"><button class="ghost" id="btnCopyRow">행 복사</button></div>
  </div>
</div>

<script>
/* ▼▼▼ 배포 후 교체 (…/exec) ▼▼▼ */
const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbyRoGj5cO7ogYUZvwINh8FBw3f6pspmrilVfB5iMPHnDLAT-cfOoQlxjgruFkm8cWy7/exec';
/* ▲▲▲ */
document.getElementById('urlShow').textContent = SUBMIT_URL;

/* 5개 탭 헤더 — apps_script_code.gs 의 HEADERS 와 반드시 동일하게 유지 */
const HEADERS = {
  '1차_입사자':['제출시각','차수','진단시점','역할','소속','작성자','대상자','직급CL','입사일','Q1. 채용 과정(공고, 면접, 오퍼)에서 안내받은 내용이…','Q2. 최종 처우 및 근무조건 협의 과정이 투명하고 합리적…','Q3. 입사 결정에 가장 크게 작용한 요인은 무엇이었나요?…','Q4. 채용 시 안내받은 직무/역할 내용이 실제 배치된 업…','Q5. 현재 담당 업무가 본인의 경력과 전문성을 발휘하기에…','Q6. 채용 시 기대와 실제 업무 간 차이가 있었다면 어떤…','Q7. 입사 첫 달, 팀과 업무에 적응하는 데 큰 어려움은…','Q8. 전반적으로 이번 채용 프로세스에 만족한다.','Q9. 채용 프로세스에서 개선되었으면 하는 점이 있다면 자…','리커트평균'],
  '1차_HM':['제출시각','차수','진단시점','역할','소속','작성자','대상자','직급CL','입사일','Q1. 서류/면접에서 파악된 역량과 실제 초기 업무 수행 …','Q2. 채용 시 기대했던 직무 적합성 수준에 부합하고 있다…','Q3. 서류/면접 시점과 실제 역량 간 차이가 있었다면 어…','Q4. 현재까지의 초기 적응 속도가 기대 수준이다.','Q5. 초기 업무 수행 결과물의 수준이 기대에 부합한다.','Q6. 조기 안정적 전력화를 위해 추가로 필요한 지원이 있…','Q7. 이 채용 건은 전반적으로 성공적인 채용이었다고 평가…','Q8. 향후 이 직무/포지션에 유사한 프로필의 인재를 다시…','Q9. 채용담당자에게 전달하고 싶은 피드백(포지셔닝, 소싱…','리커트평균'],
  '2차_입사자':['제출시각','차수','진단시점','역할','소속','작성자','대상자','직급CL','입사일','Q1. 입사 후 팀 내 분위기에 자연스럽게 녹아들 수 있었…','Q2. 팀장/동료가 업무 외적인 부분(생활/고충 등)에도 …','Q3. 조직 문화나 내부 규범을 이해하는 데 어려움이 있었…','Q4. 입사 초기 업무 파악에 필요한 안내(자료, 시스템,…','Q5. 담당 업무 수행에 실질적인 도움을 받을 수 있었다 …','Q6. 업무 온보딩 과정에서 가장 부족하거나 아쉬웠던 점은…','Q7. 입사 전 기대했던 것과 실제 회사 환경이 대체로 일…','Q8. 현재 이 회사에서 장기적으로 근무하고 싶다는 생각이…','Q9. 회사 또는 HR에 바라는 점이 있다면 자유롭게 적어…','리커트평균','자가점검_성과 달성도','자가점검_직무 전문성','자가점검_직무 적합성','자가점검_확장 가능성','자가점검_조직 적합성','자가점검_협업 능력','자가점검_책임감/성실성'],
  '2차_HM':['제출시각','차수','진단시점','역할','소속','작성자','대상자','직급CL','입사일','1.성과 달성도(자가점검)','1.성과 달성도(팀장피드백)','2.직무 전문성(자가점검)','2.직무 전문성(팀장피드백)','3.직무 적합성(자가점검)','3.직무 적합성(팀장피드백)','4.확장 가능성(자가점검)','4.확장 가능성(팀장피드백)','5.조직 적합성(자가점검)','5.조직 적합성(팀장피드백)','6.협업 능력(자가점검)','6.협업 능력(팀장피드백)','7.책임감/성실성(자가점검)','7.책임감/성실성(팀장피드백)','면담일','입사자서명','팀장서명'],
  '임원결재':['제출시각','입사자_소속','입사자_성명','입사일','직급','성과 달성도_선택','성과 달성도_취득(배점25)','직무 전문성_선택','직무 전문성_취득(배점15)','직무 적합성_선택','직무 적합성_취득(배점15)','확장 가능성_선택','확장 가능성_취득(배점15)','조직 적합성_선택','조직 적합성_취득(배점10)','협업 능력_선택','협업 능력_취득(배점10)','책임감/성실성_선택','책임감/성실성_취득(배점10)','직무역량(70)','조직적응(30)','총점','팀장환산등급','팀장_성명','팀장_의견','팀장_서명','임원_점수','임원_등급','임원_의견','임원_서명']
};

const $ = s => document.querySelector(s);
function msg(kind, text){ const m=$('#msg'); m.className='msg '+kind+' show'; m.textContent=text; }

function parsePayload(){
  let p;
  try { p = JSON.parse($('#in').value.trim()); }
  catch(e){ msg('err','JSON 형식이 아닙니다: '+e.message); return null; }
  return p;
}

$('#btnSend').onclick = ()=>{
  const p = parsePayload(); if (!p) return;
  if (SUBMIT_URL === 'MY_WEB_APP_URL'){ msg('err','SUBMIT_URL이 설정되지 않았습니다.'); return; }
  msg('ok','전송 중…');
  fetch(SUBMIT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
    .then(()=> msg('ok','재전송 완료. 구글 시트에서 반영 여부를 확인하세요. (중복 방지: 성공 시 이 창을 닫으세요)'))
    .catch(e=> msg('err','재전송 실패: '+e+' — 아래 “TSV 생성”으로 시트에 직접 붙여넣으세요.'));
};

$('#btnTsv').onclick = ()=>{
  const p = parsePayload(); if (!p) return;
  let tab, rec;
  if (p._kind === 'exec_final'){ tab = '임원결재'; rec = p.record || {}; }
  else if (p._kind === 'exec_stage1'){ msg('err','이 값은 팀장 1단계(임시저장)입니다. 임원 최종 제출(exec_final) JSON을 붙여넣으세요. 임시로라도 넣으려면 executive_approval 재전송을 사용하세요.'); return; }
  else { tab = p._sheet; rec = p.record || {}; }

  const hdr = HEADERS[tab];
  if (!hdr){ msg('err','알 수 없는 탭: '+tab); return; }
  if (!rec['제출시각']) rec['제출시각'] = new Date().toLocaleString('ko-KR');

  const cells = hdr.map(h=>{
    let v = rec[h];
    if (v === undefined || v === null) v = '';
    // 시트 붙여넣기 시 탭/개행이 셀을 깨뜨리므로 치환
    return String(v).replace(/\t/g,'  ').replace(/\r?\n/g,' ⏎ ');
  });
  $('#outTab').textContent = tab + '  (열 ' + hdr.length + '개)';
  $('#outRow').textContent = cells.join('\t');
  $('#outCard').style.display = '';
  msg('ok','TSV 행 생성 완료. 아래 “행 복사” → 해당 탭 마지막 행 아래에 붙여넣기.');
};

$('#btnCopyRow').onclick = ()=>{
  navigator.clipboard.writeText($('#outRow').textContent).then(()=>{
    const b=$('#btnCopyRow'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='행 복사',1500);
  });
};
</script>
</body>
</html>
