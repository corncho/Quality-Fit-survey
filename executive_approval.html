<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온보딩 적응 만족도 · 담당임원 결재</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --ink:#1a2230;--ink-soft:#4a556a;--line:#e3e7ee;--line-soft:#eef1f6;--bg:#f6f7fa;--card:#fff;
    --accent:#0b3d91;--accent2:#1f6feb;--accent-soft:#eaf1fe;--warn:#b4530a;--ok:#0f7a4d;--ok-soft:#e7f4ee;
    --gS:#0f7a4d;--gA:#1f6feb;--gB1:#0891b2;--gB:#b4830a;--gC:#c0392b;
    --mood:#0f7a4d;--mood-soft:#eef8f2;--mood-line:#cdead9;
    --shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  /* 멘트는 단어 중간에서 끊기지 않게(keep-all), 여러 줄이면 줄 길이를 고르게 */
  .mood,.note,h1,h2,.lead,.item-desc{text-wrap:balance}
  .wrap{max-width:940px;margin:0 auto;padding:26px 20px 90px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1f6feb,#0b3d91);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
  .brand b{font-size:15px;font-weight:700}.brand span{display:block;font-size:11.5px;color:var(--ink-soft)}
  .conf{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--warn);border:1px solid #f0d6b8;background:#fdf4e7;border-radius:6px;padding:5px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px;margin-bottom:16px}
  h1{font-size:21px;margin:0 0 4px}.lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 4px}
  .mood{background:var(--mood-soft);border:1px solid var(--mood-line);border-radius:12px;padding:14px 16px;font-size:13px;color:#1d5c40;margin-bottom:16px;line-height:1.6}
  .sec-t{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.02em;margin:2px 0 14px;display:flex;align-items:center;gap:8px}
  .sec-t .n{width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
  label.fld{display:block}.lb{font-size:12.5px;font-weight:600;margin-bottom:5px;display:block;color:var(--ink-soft)}
  input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(31,111,235,.10)}
  textarea{resize:vertical;min-height:70px}
  input:disabled,select:disabled,textarea:disabled{background:#f1f3f7;color:#7a8497;cursor:not-allowed;-webkit-text-fill-color:#7a8497;opacity:1}
  .people.locked{background:#fafbfd}
  .people .who .lk-tag{font-weight:600;color:var(--ink-soft);margin-left:8px;font-size:11px}
  .btn.loading{opacity:.85;cursor:progress}
  .btn.loading::before{content:"";width:13px;height:13px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.exec-wait .card:not(#stageBanner){display:none!important}
  body.exec-wait .actions{display:none!important}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
  .people{border:1px solid var(--line-soft);border-radius:10px;padding:14px;margin-bottom:10px}
  .people .who{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:10px}

  .cat-band{font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:8px 8px 0 0;padding:8px 14px;margin-top:18px;display:flex;justify-content:space-between}
  .cat-band .w{opacity:.85;font-weight:600}
  .item{border:1px solid var(--line);border-top:none;padding:16px 14px}
  .item:last-of-type{border-radius:0 0 8px 8px}
  .item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .item-name{font-weight:700;font-size:14px}.item-name .bp{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-left:6px}
  .item-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;max-width:560px}
  .earned{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;background:var(--accent-soft);border-radius:8px;padding:6px 12px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .sc{border:1.5px solid var(--line);border-radius:9px;padding:9px 4px;text-align:center;cursor:pointer;transition:.1s;background:#fff}
  .sc:hover{border-color:#b9c6e6}.sc.on{border-color:var(--accent2);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(31,111,235,.08)}
  .sc .v{font-size:16px;font-weight:800}.sc .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
  .sc.on .v{color:var(--accent2)}
  .crit-toggle{margin-top:10px;font-size:12px;color:var(--accent2);background:none;border:none;cursor:pointer;padding:4px 0;font-weight:600}
  .crit{display:none;margin-top:8px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .crit.show{display:block}
  .crit table{width:100%;border-collapse:collapse;font-size:11.5px}
  .crit th{background:var(--line-soft);padding:7px 9px;text-align:left;font-weight:700;white-space:nowrap}
  .crit td{padding:7px 9px;border-top:1px solid var(--line-soft);vertical-align:top}
  .crit td.s{font-weight:800;white-space:nowrap;width:64px}
  .crit tr.hl td{background:var(--accent-soft)}
  .crit td.clmatch{font-weight:600}
  .crit tr.hl td.clmatch{font-weight:800;color:var(--accent2)}
  /* 입사자 직급에 해당하는 열은 머리글부터 맨 아래 칸까지 통째로 음영 */
  .crit th.clcol{background:#ffe3a3;color:#6b4300}
  .crit td.clcol{background:#fff3cf}
  .crit tr.hl td.clcol{background:#ffe08a;color:#1a2230}
  .crit .clbadge{font-size:10.5px;color:var(--ink-soft);padding:6px 9px;background:#fbfcfe;border-top:1px solid var(--line-soft)}

  .total-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,#0b3d91,#1f6feb);color:#fff;border-radius:12px;padding:22px 24px;margin-top:20px}
  .total-box .big{font-size:40px;font-weight:800;line-height:1}.total-box .big small{font-size:18px;opacity:.7;font-weight:600}
  .total-box .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
  .grade-chip{font-size:30px;font-weight:800;border-radius:12px;padding:10px 22px;background:rgba(255,255,255,.16)}
  .subtotals{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
  .subtotals div{font-size:12px;opacity:.9}.subtotals b{display:block;font-size:19px;font-weight:800}

  .gradekey{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:12px}
  .gradekey span{border:1px solid var(--line);border-radius:6px;padding:3px 9px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#0a336f}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:#b9c6e6}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .prog{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s ease}
  .step-meta{font-size:13px;color:var(--ink-soft);margin-bottom:7px;display:flex;justify-content:space-between;font-weight:600}
  .err-banner{background:#fdecec;color:#a11;border:1px solid #f6c9c9;border-radius:10px;padding:11px 14px;font-size:13px;margin-top:14px;display:none;line-height:1.6}
  .err-banner.show{display:block}
  .missing{border-color:#d33!important;box-shadow:0 0 0 3px rgba(221,51,51,.12)!important}
  /* 임원 결재 화면: 팀장이 준 평가 항목 요약 */
  .sum-band{font-size:12.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:8px 8px 0 0;padding:8px 14px;margin-top:16px;display:flex;justify-content:space-between}
  .sum-band .w{opacity:.85;font-weight:600}
  .sum-item{border:1px solid var(--line);border-top:none;padding:16px 16px 12px}
  .sum-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .sum-name{font-size:18px;font-weight:800;line-height:1.35}
  .sum-no{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;margin-right:10px;vertical-align:1px}
  .sum-name .bp{font-size:13px;color:var(--ink-soft);font-weight:600;margin-left:8px}
  .sum-score{display:flex;gap:10px;flex-wrap:wrap}
  .sum-chip{border-radius:10px;padding:7px 16px;background:var(--accent-soft);text-align:center;min-width:104px}
  .sum-chip small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
  .sum-chip b{display:block;font-size:24px;font-weight:800;color:var(--accent2);line-height:1.2}
  .sum-chip em{display:block;font-size:12px;font-style:normal;color:var(--ink-soft);font-weight:600}
  .sum-chip.earn{background:#e9f6ef}.sum-chip.earn b{color:var(--ok)}
  .sum-desc{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.55}
  .note{font-size:11.5px;color:var(--ink-soft);background:var(--line-soft);border-radius:9px;padding:11px 14px;margin-top:14px;line-height:1.5}
  .sign-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .hidden{display:none!important}

  /* 내가 할 일 연동(제출 직후 남은 단계, 다음 사람에게 보내는 완료 메일). 본문 스타일과 겹치지 않게 .mt 안에서만 적용 */
  .mt{--red:#c62828;--red-soft:#fdecec;--warn-soft:#fdf4e7}
  .mt p{max-width:none}
  .mt .box{margin-top:20px;text-align:left;border:1.5px solid var(--accent2);border-left-width:6px;background:var(--accent-soft);border-radius:12px;padding:18px 18px 16px}
  .mt .box.ok{border-color:#bfe3d0;background:var(--ok-soft)}
  .mt .box h3{font-size:16.5px;font-weight:800;color:var(--accent);margin:0 0 4px}
  .mt .box.ok h3{color:var(--ok)}
  .mt .box .lead{font-size:13.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6}
  .mt .alert{margin:0 0 14px;text-align:left;background:var(--red-soft);border:1.5px solid #f0a8a8;border-left-width:6px;border-radius:12px;padding:13px 16px;color:#7a1414;font-size:13.5px;line-height:1.6}
  .mt .alert b{color:var(--red);font-size:15px}
  .mt .pg{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
  .mt .bar{flex:1;height:7px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .mt .bar i{display:block;height:100%;background:var(--accent2);border-radius:99px}
  .mt .t{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:9px;flex-wrap:wrap;text-align:left}
  .mt .t .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .mt .t.wait .no{background:#9aa5b8}.mt .t.dn .no{background:var(--ok)}
  .mt .t .body{flex:1;min-width:220px}
  .mt .t .ti{font-size:15px;font-weight:800}
  .mt .t .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.7}
  .mt .chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 10px;margin-right:6px}
  .mt .chip.go{background:var(--ok-soft);color:var(--ok)}.mt .chip.wt{background:#eef0f4;color:#5b6678}.mt .chip.dn{background:var(--ok-soft);color:var(--ok)}.mt .chip.due{background:var(--warn-soft);color:var(--warn)}.mt .chip.hot{background:var(--red);color:#fff}
  .mt .btn.sm{padding:8px 12px;font-size:12.5px}
  .mt .btn.red{background:var(--red);color:#fff}.mt .btn.red:hover{background:#a51f1f}
  .mt .btn[disabled]{background:#cfd6e4;color:#fff;cursor:not-allowed}
  .mt .btn.link{text-decoration:none}
  .mt .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mt .mtone{white-space:nowrap}   /* 안내 문장은 한 줄로(좁은 화면에서는 줄바꿈 허용) */
  @media(max-width:760px){.mt .mtone{white-space:normal}}
  .mt ul.mtnote{margin:10px 0 0;padding-left:20px;font-size:12px;color:var(--ink-soft);line-height:1.7}
  .mt ul.mtnote li+li{margin-top:2px}
  .mt .grp{margin-top:20px}.mt .grp:first-of-type{margin-top:6px}
  .mt .grp h3{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0}
  .mt .grp .gsub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .mt .sub2{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .mt .sub2>b{font-size:13.5px}
  .mt .pv{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .mt .pvsub{background:#f3f5f9;border-bottom:1px solid var(--line);padding:10px 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
  .mt .pvsub b{color:var(--ink)}
  .mt .pvbody{padding:16px;overflow-x:auto}
  .mt .foot{margin-top:14px;font-size:13px;color:var(--ink-soft)}
  .mt .foot a{color:var(--accent2);font-weight:700}
  .mtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1a2230;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
  .mtoast.show{opacity:1}

  @media print{
    body{background:#fff}.wrap{max-width:100%;padding:0}
    .topbar .conf{display:none}.actions,.crit-toggle{display:none}.crit{display:none!important}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:10px}
    .total-box{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media(max-width:720px){.g4,.g3{grid-template-columns:1fr 1fr}.scale{grid-template-columns:repeat(5,1fr)}.sc .l{display:none}.subtotals{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="mk">HR</div>
      <div><b>온보딩 적응 만족도 · 담당임원 결재</b><span>2차 (D+90) · 인재개발팀</span></div></div>
    <div class="conf">CONFIDENTIAL</div>
  </div>

  <div class="card" id="stageBanner" style="padding:16px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span id="stagePill" style="font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:5px 12px"></span>
    <span id="stageDesc" class="muted" style="font-size:13px"></span>
    <button id="gotoExecBtn" class="btn ghost" style="margin-left:auto;padding:8px 13px;font-size:12.5px;display:none" onclick="document.getElementById('execCard').scrollIntoView({behavior:'smooth',block:'start'})">결재란으로 이동</button>
    <button id="retryBtn" class="btn ghost" style="margin-left:auto;padding:8px 13px;font-size:12.5px;display:none" onclick="location.reload()">다시 불러오기</button>
  </div>

  <div class="card" id="moodCard" style="display:none"><div class="mood" id="moodBox"></div></div>

  <!-- 1. 인적사항 -->
  <div class="card">
    <div class="sec-t"><span class="n">1</span>인적사항</div>
    <div class="people" id="blkP"><div class="who">입사자</div>
      <label class="fld" style="margin-top:0"><span class="lb">소속</span>
        <select id="p_dept_sel" onchange="onDeptSelChange('p')"></select>
        <input type="text" id="p_dept_other" placeholder="소속(팀) 직접 입력" style="margin-top:6px" class="hidden">
      </label>
      <div class="grid g3" style="margin-top:12px">
        <label class="fld" style="margin-top:0"><span class="lb">성명</span><input id="p_name"></label>
        <label class="fld" style="margin-top:0"><span class="lb">입사일</span><input type="date" id="p_hire"></label>
        <label class="fld" style="margin-top:0"><span class="lb">직급 (CL)</span>
          <select id="p_cl" onchange="onCLChange()"><option value="">선택</option>
            <option>CL1</option><option>CL2</option><option>CL3</option><option>CL4</option><option>CL4(p)</option><option>기술직</option><option>계약직</option></select></label>
      </div></div>
    <div class="people" id="blkHM"><div class="who">팀장 (평가자)<span class="lk-tag" id="tagHM"></span></div>
      <label class="fld" style="margin-top:0"><span class="lb">소속</span>
        <select id="hm_dept_sel" onchange="onDeptSelChange('hm')"></select>
        <input type="text" id="hm_dept_other" placeholder="소속(팀) 직접 입력" style="margin-top:6px" class="hidden">
      </label>
      <div class="grid g3" style="margin-top:12px">
        <label class="fld" style="margin-top:0"><span class="lb">성명</span><input id="hm_name"></label>
        <label class="fld" style="margin-top:0"><span class="lb">평가일</span><input type="date" id="hm_date"></label>
        <label class="fld" style="margin-top:0"><span class="lb">서명 (성명)</span><input id="hm_sign"></label>
      </div></div>
    <div class="people" id="blkEX"><div class="who">담당임원 (결재자)<span class="lk-tag" id="tagEX"></span></div>
      <label class="fld" style="margin-top:0"><span class="lb">소속</span><input id="ex_dept"></label>
      <div class="grid g3" style="margin-top:12px">
        <label class="fld" style="margin-top:0"><span class="lb">성명</span><input id="ex_name"></label>
        <label class="fld" style="margin-top:0"><span class="lb">평가일</span><input type="date" id="ex_date"></label>
        <label class="fld" style="margin-top:0"><span class="lb">서명 (성명)</span><input id="ex_sign"></label>
      </div></div>
    <div class="note">직급(CL)을 선택하면 각 평가 항목의 <b>기준 보기</b>에 해당 직급 기준이 강조되어 표시됩니다. (첨부4 · 직급별/항목별 평가 기준)</div>
  </div>

  <!-- 2. 팀장 평가 -->
  <div class="card" id="hmCard">
    <div class="sec-t"><span class="n">2</span>팀장 평가</div>
    <p class="lead" id="hmLead">각 항목의 수준을 선택하면 배점 대비 취득 점수가 자동 계산됩니다. 항목별 <b>기준 보기</b>로 직급별 판단 기준을 확인할 수 있습니다.</p>
    <div id="evalArea"></div>

    <div id="scoreReveal" style="display:none">
      <div class="total-box">

  if(sel.value==='__other__') other.focus();
}

  const sel=document.getElementById(prefix+'_dept_sel');

}
function setDept(prefix, val, disable){
  const sel=document.getElementById(prefix+'_dept_sel'), other=document.getElementById(prefix+'_dept_other');
  if(!sel) return;
  if(val){
    /* 링크로 전달된 소속값은 목록에 없어도 별도 입력칸을 보여주지 않고, 드롭다운 자체에 그 값을 옵션으로 추가해 선택된 상태로 보여준다. */
    if(!DEPT_ALL.includes(val) && !Array.from(sel.options).some(o=>o.value===val)){
      const opt=document.createElement('option'); opt.value=val; opt.textContent=val;
      sel.insertBefore(opt, sel.querySelector('option[value="__other__"]'));
    }
    sel.value=val; other.value=''; other.classList.add('hidden');
  }else{
    sel.value=''; other.value=''; other.classList.add('hidden');
  }
  sel.disabled=!!disable; other.disabled=!!disable;
}

const scores={};
const esc=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function clGroup(){const v=document.getElementById('p_cl').value; if(v==='CL1')return'CL1'; if(v==='CL2'||v==='CL3')return'CL23'; if(v==='CL4')return'CL4'; if(v==='CL4(p)')return'CL4p'; return null;}
function grade(t){return t>=95?'S':t>=90?'A':t>=80?'B+':t>=70?'B':'C';}
function gradeColor(g){return{S:'var(--gS)',A:'var(--gA)','B+':'var(--gB1)',B:'var(--gB)',C:'var(--gC)'}[g]||'#fff';}

function buildEval(){
  let html='';
  CATS.forEach(cat=>{
    html+=`<div class="cat-band">${esc(cat.name)}<span class="w">배점 ${cat.weight}점</span></div>`;
    cat.items.forEach(it=>{
      html+=`<div class="item" id="item_${it.key}">
        <div class="item-head">
          <div><div class="item-name">${esc(it.t)}<span class="bp">(배점 ${it.bp})</span></div>
            <div class="item-desc">${esc(it.d)}</div></div>
          <div class="earned" id="earn_${it.key}">0 / ${it.bp}</div>
        </div>
        <div class="scale">${SCALE.map(s=>`
          <div class="sc" id="sc_${it.key}_${s.v}" onclick="pick('${it.key}',${s.v})">
            <div class="v">${s.v}</div><div class="l">${esc(s.l)}</div></div>`).join('')}</div>
        <button class="crit-toggle" onclick="toggleCrit('${it.key}')">기준 보기 &#9662;</button>
        <div class="crit" id="crit_${it.key}">${critTable(it.key)}</div>
      </div>`;
    });
  });
  document.getElementById('evalArea').innerHTML=html;
}
function critTable(key){
  const g=clGroup();
  let rows='';
  [5,4,3,2,1].forEach(sv=>{
    const cells=CLCOLS.map(([code])=>`<td${g===code?' class="clmatch clcol"':''}>${esc(CRIT[key][sv][code])}</td>`).join('');
    rows+=`<tr class="${scores[key]===sv?'hl':''}" data-s="${sv}"><td class="s">${sv}점</td>${cells}</tr>`;
  });
  const head=CLCOLS.map(([code,lbl])=>`<th${g===code?' class="clcol"':''}>${lbl}</th>`).join('');
  return `<table><thead><tr><th>점수</th>${head}</tr></thead><tbody>${rows}</tbody></table>
    <div class="clbadge">${g?'현재 입사자 직급('+document.getElementById('p_cl').value+') 기준 열이 강조됩니다.':(document.getElementById('p_cl').value==='계약직'?'계약직은 직급(CL) 구분 없이 전체 기준을 참고해 주세요.':'직급(CL)을 선택하면 해당 열이 강조됩니다.')}</div>`;
}
function toggleCrit(key){document.getElementById('crit_'+key).classList.toggle('show');}
function pick(key,v){
  scores[key]=v;
  CATS.flatMap(c=>c.items).forEach(it=>{if(it.key===key){
    [5,4,3,2,1].forEach(s=>document.getElementById(`sc_${key}_${s}`).classList.toggle('on',s===v));
    const earned=it.bp*v/5; document.getElementById('earn_'+key).textContent=`${earned} / ${it.bp}`;
  }});
  const box=document.getElementById('crit_'+key);
  box.querySelectorAll('tr[data-s]').forEach(tr=>tr.classList.toggle('hl',Number(tr.dataset.s)===v));
  recalc();
}
function recalc(){
  let job=0,org=0;
  CATS.forEach(cat=>cat.items.forEach(it=>{
    const v=scores[it.key]; if(!v) return;
    const e=it.bp*v/5; if(cat.name==='직무 역량') job+=e; else org+=e;
  }));
  const total=job+org;
  document.getElementById('subJob').textContent=job;
  document.getElementById('subOrg').textContent=org;
  document.getElementById('totalScore').textContent=total;
  updateProgress();
}
/* ===== 필수 항목 점검 + 진행 바 ===== */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function requiredItems(){
  const v=id=>{ const el=document.getElementById(id); return el?String(el.value||'').trim():''; };
  const L=[];
  if(STAGE==='hm'){
    L.push(['입사자 소속',getDept('p'),'p_dept_sel'],['입사자 성명',v('p_name'),'p_name'],['입사자 입사일',v('p_hire'),'p_hire'],['입사자 직급(CL)',v('p_cl'),'p_cl']);
    CATS.flatMap(c=>c.items).forEach((it,i)=>L.push([(i+1)+'. '+it.t+' 점수 선택',scores[it.key]||'','item_'+it.key]));
    L.push(['팀장 소속',getDept('hm'),'hm_dept_sel'],['팀장 성명',v('hm_name'),'hm_name'],['팀장 평가일',v('hm_date'),'hm_date'],['팀장 서명',v('hm_sign'),'hm_sign'],['팀장 평가 의견',v('hm_comment'),'hm_comment']);
  }else{
    L.push(['담당임원 소속',v('ex_dept'),'ex_dept'],['담당임원 성명',v('ex_name'),'ex_name'],['담당임원 평가일',v('ex_date'),'ex_date'],['담당임원 서명',v('ex_sign'),'ex_sign'],['담당임원 점수',v('ex_score'),'ex_score'],['담당임원 평가 의견',v('ex_comment'),'ex_comment']);
  }
  return L;
}
function updateProgress(){
  const L=requiredItems(), done=L.filter(x=>x[1]!=='').length, pct=L.length?Math.round(done/L.length*100):0;
  const bar=document.getElementById('progBar'), txt=document.getElementById('pctTxt'), lb=document.getElementById('progLabel');
  if(bar) bar.style.width=pct+'%';
  if(txt) txt.textContent=pct+'%';
  if(lb) lb.textContent=(STAGE==='hm'?'1단계 팀장 평가 ':'2단계 담당임원 결재 ')+'작성 진행률 ('+done+' / '+L.length+')';
}
function clearMissing(){
  document.querySelectorAll('.missing').forEach(e=>e.classList.remove('missing'));
  const b=document.getElementById('errBanner'); if(b) b.classList.remove('show');
}
/* 비어 있는 항목이 있으면 목록을 보여 주고 첫 항목으로 이동한 뒤 true를 돌려준다(그 경우 다음 단계로 못 넘어감) */
function blockIfMissing(){
  const miss=requiredItems().filter(x=>x[1]==='');
  clearMissing();
  if(!miss.length) return false;
  miss.forEach(m=>{ const el=document.getElementById(m[2]); if(el) el.classList.add('missing'); });
  const b=document.getElementById('errBanner');
  b.innerHTML='<b>아직 작성하지 않은 항목이 '+miss.length+'개 있습니다.</b> 모두 작성하면 다음 단계로 넘어갈 수 있습니다.<br>'+miss.map(m=>esc(m[0])).join(', ');
  b.classList.add('show');

function toFlatRecord(d){

    '입사일': d.입사자.입사일||''
  };
  Object.keys(itemKeyMap).forEach(name=>{
    const bp=itemKeyMap[name];
    const it=(d.팀장평가||{})[name]||{};
    rec[`${name}_선택`]=it.선택??'';

  });
  rec['직무역량(70)']=d.직무역량점수??'';
  rec['조직적응(30)']=d.조직적응점수??'';
  rec['총점']=d.총점??'';
  rec['팀장환산등급']=d.등급||'';
  rec['팀장_소속']=d.팀장?.소속||'';
  rec['팀장_성명']=d.팀장?.성명||'';
  rec['팀장_평가일']=d.팀장?.평가일||'';
  rec['팀장_의견']=d.팀장?.의견||'';
  rec['팀장_서명']=d.팀장?.서명||'';
  rec['임원_소속']=d.담당임원?.소속||'';
  rec['임원_성명']=d.담당임원?.성명||'';
  rec['임원_평가일']=d.담당임원?.평가일||'';
  rec['임원_점수']=d.담당임원?.점수||'';

  rec['임원_서명']=d.담당임원?.서명||'';
  return rec;
}

/* 제출 직전 재확인: 관리자가 링크를 실시간으로 닫았으면 제출을 막고 종료 화면을 보여 준다(응답이 늦거나 실패하면 통과). */
function linkClosedNow(){
  return new Promise(resolve=>{
    if(!_linkCode||!SUBMIT_URL){ resolve(false); return; }
    let done=false; const fin=v=>{ if(done)return; done=true; resolve(v); };
    const cb='__linkNow'+Date.now();
    window[cb]=(resp)=>fin(!resp||!resp.ok?false:(resp.status==='closed'?'closed':(resp.done?'done':false)));
    const hire=(HM_DATA&&HM_DATA.입사자&&HM_DATA.입사자.입사일)||document.getElementById('p_hire').value||_params.get('hire')||'';
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=checkLink&code='+encodeURIComponent(_linkCode)+'&k='+execKey()+'&hire='+encodeURIComponent(hire)+'&callback='+cb+'&_='+Date.now();
    s.onerror=()=>fin(false); document.body.appendChild(s); setTimeout(()=>fin(false),9000);
  });
}

  /* 최근 10분 안에 링크가 열려 있다고 확인했다면 제출 직전 재확인(서버 왕복 1회)을 생략한다 */
  const lc=(EXL.okAt&&Date.now()-EXL.okAt<600000)?false:await linkClosedNow();
  if(lc){ lc==='done' ? renderAlreadyDone() : renderClosedExec(); return; }
  const d=collect();

/* 링크 복사: 클립보드 API가 막힌 환경에서는 예전 방식으로 한 번 더 시도하고, 그래도 안 되면 링크를 선택해 둔 채 안내한다(조용히 실패하지 않음) */
function copyLinkText(text,inputEl,btn){
  const flash=msg=>{ if(!btn)return; const o=btn.dataset.o||btn.textContent; btn.dataset.o=o; btn.textContent=msg; setTimeout(()=>{btn.textContent=o;},1800); };
  const legacy=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
      const r=document.execCommand('copy'); document.body.removeChild(ta);
      if(r){ flash('복사됨 \u2713'); return; }
    }catch(e){}
    if(inputEl){ inputEl.focus(); inputEl.select(); }
    flash('Ctrl+C로 복사하세요');
  };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>flash('복사됨 \u2713')).catch(legacy); } else legacy();
}

/* 링크 잠금 여부 확인(HR이 시트 '_link_status' 상태 열을 closed로 바꾸면 접근 차단). */
const EXL={started:false,released:false,st:false,okAt:0,waiters:[]};
/* 링크 확인을 기다렸다가 화면을 열지(true), 먼저 열고 뒤에서 확인할지(false). false면 진입이 서버 응답을 기다리지 않고, 닫힘/완료 응답이 오면 그때 해당 화면으로 바뀐다.
   제출 직전에도 최근 확인 결과가 없으면 한 번 더 확인하므로 닫힌 링크로 제출되지는 않는다. 예전 방식으로 되돌리려면 true. */
const LINK_BLOCKING=false;
function startExecLinkCheck(code){   /* 요청은 한 번만. 임원 링크는 팀장 평가 조회와 동시에 미리 보내 대기 시간을 겹친다 */
  if(EXL.started)return; EXL.started=true;
  const release=()=>{ if(EXL.released)return; EXL.released=true; EXL.waiters.splice(0).forEach(f=>f(EXL.st)); };
  window.__linkStatusCb2=(resp)=>{
    const closed=!!(resp && resp.ok && resp.status==='closed');
    const st=closed?'closed':((resp && resp.ok && resp.done)?'done':false);
    if(st) EXL.st=st;
    if(resp && resp.ok && !st) EXL.okAt=Date.now();   /* 제출 직전 재확인을 생략해도 되는지 판단하는 기준 시각 */
    if(EXL.released && st){ st==='done' ? renderAlreadyDone() : renderClosedExec(); return; }   /* 늦게 도착한 닫힘/완료 응답도 반영 */
    release();
  };
  const s=document.createElement('script');
  const hire=(HM_DATA&&HM_DATA.입사자&&HM_DATA.입사자.입사일)||_params.get('hire')||'';
  s.src=SUBMIT_URL+'?action=checkLink&code='+encodeURIComponent(code)+'&k='+execKey()+'&hire='+encodeURIComponent(hire)+'&callback=__linkStatusCb2&_='+Date.now();
  s.onerror=release;
  document.body.appendChild(s);
  setTimeout(release, 20000);   /* 서버 응답이 보통 2~4초, 느리면 10초 이상이라 넉넉히 기다린 뒤에도 안 오면 막지 않고 통과 */
}
function checkLinkStatusExec(code, cb){
  startExecLinkCheck(code);
  if(EXL.released) cb(EXL.st); else EXL.waiters.push(cb);
}
/* ===== 내가 할 일 연동(링크에 me= 토큰이 있을 때만 동작). onboarding_survey.html, executive_approval.html 두 화면에 같은 코드를 둔다 =====
   - 제출 직후 화면에 "남은 단계"와 바로가기를 보여 준다(서버가 응답 시트로 계산).
   - 제출이 다음 사람의 단계를 여는 경우(입사자 2차 -> 팀장, 팀장 평가 -> 임원), 그 사람에게 보낼 완료 메일(.eml)을 만들어 준다. */
const MT={me:ME_TOKEN,k:'',code:'',who:'',tasks:null,sent:false};
const MT_TITLE={
  n1:t=>'1차 채용 Quality 진단',
  h1:t=>'1차 채용 Quality 평가: '+t.who+'님',
  n2:t=>'2차 온보딩 적응 진단(자가점검)',
  h2:t=>'2차 자가점검 피드백 작성: '+t.who+'님',
  cats:t=>'2차 평가 점수 입력과 임원 결재 요청: '+t.who+'님',
  exec:t=>'온보딩 적응 만족도 결재: '+t.who+'님'
};
const MT_WAIT={
  h2:t=>t.who+'님이 자가점검을 제출하면 자동으로 열립니다',
  exec:t=>'팀장님의 평가가 끝나면 열리고, 팀장님이 열렸다고 안내해 주십니다'
};
const mtWD=['일','월','화','수','목','금','토'];
function mtEsc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function mtToday(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function mtDstr(iso){const d=new Date(iso+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+' ('+mtWD[d.getDay()]+')';}
function mtDleft(due){return Math.round((new Date(due+'T00:00:00')-new Date(mtToday()+'T00:00:00'))/86400000);}
function mtHasDue(t){return /^\d{4}-\d{2}-\d{2}$/.test(t.due||'');}
function mtUrgent(t){return t.st!=='done'&&mtHasDue(t)&&mtDleft(t.due)<=3;}
function mtDueTxt(t){if(!mtHasDue(t))return '';const d=mtDleft(t.due);return d<0?mtDstr(t.due)+' 마감 지남':d===0?mtDstr(t.due)+' 오늘 마감':mtDstr(t.due)+' 마감 D-'+d;}
function mtHubUrl(){return location.origin+location.pathname.replace(/[^\/]*$/,'')+'my_tasks.html?me='+encodeURIComponent(MT.me);}
function mtToast(m){
  let t=document.getElementById('mtoast');
  if(!t){t=document.createElement('div');t.id='mtoast';t.className='mtoast';document.body.appendChild(t);}
  t.textContent=m;t.classList.add('show');clearTimeout(mtToast._t);mtToast._t=setTimeout(()=>t.classList.remove('show'),3600);
}
function mtFetch(cb,me){
  /* 서버가 간헐적으로 10초에서 1분 넘게 걸려서 길게 기다리고, 오류나 시간 초과면 한 번 더 시도한다(먼저 온 정상 응답을 사용) */
  let finished=false,attempt=0;const fin=r=>{if(finished)return;finished=true;cb(r);};
  const who=me||MT.me;
  const retryOrFail=()=>{if(finished)return;if(attempt<2)send();else fin(null);};
  const send=()=>{
    attempt++;
    const name='__mtd'+Date.now()+Math.floor(Math.random()*1000);
    window[name]=r=>fin(r);
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=myTasks&me='+encodeURIComponent(who)+'&callback='+name+'&_='+Date.now();
    s.onerror=()=>{setTimeout(retryOrFail,1500);};document.body.appendChild(s);
    setTimeout(retryOrFail,attempt===1?35000:40000);
  };
  send();
}
/* 단계 목록을 미리 받아 둔다(페이지를 연 뒤 잠시 있다가 한 번). 제출 직후 서버가 느려도 남은 단계를 바로 보여 주기 위함이며, 제출 직후에 한 번 더 받아 바뀐 것만 반영한다 */
const MTPRE={started:false,done:false,r:null,cbs:[]};
function mtPrefetch(me){
  if(!me||!SUBMIT_URL||MTPRE.started)return; MTPRE.started=true;
  mtFetch(r=>{MTPRE.done=true;MTPRE.r=(r&&r.ok&&r.data)?r:null;MTPRE.cbs.splice(0).forEach(f=>f(MTPRE.r));},me);
}
function mtCard(t,num,primary){
  const no='<div class="no">'+num+'</div>',title=mtEsc((MT_TITLE[t.k]||(()=>t.k))(t));
  const hot=mtUrgent(t),due=mtDueTxt(t),chip=due?'<span class="chip '+(hot?'hot':'due')+'">'+mtEsc(due)+'</span>':'';
  if(t.st==='done')return '<div class="t dn">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta"><span class="chip dn">완료</span>제출한 내용은 다시 볼 수 없어요</div></div></div>';
  if(t.st==='wait')return '<div class="t wait">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta"><span class="chip wt">대기 중</span>'+chip+'<br>'+mtEsc((MT_WAIT[t.k]||(()=>''))(t))+'</div></div><div class="act"><button class="btn primary sm" disabled>아직 열리지 않았어요</button></div></div>';
  return '<div class="t">'+no+'<div class="body"><div class="ti">'+title+'</div><div class="meta"><span class="chip go">지금 할 수 있어요</span>'+chip+'</div></div>'+
    '<div class="act">'+(t.url?'<a class="btn link sm '+(hot?'red':primary?'primary':'ghost')+'" href="'+mtEsc(t.url)+'">바로 작성하기</a>':'<button class="btn primary sm" disabled>링크 준비 중</button>')+'</div></div>';
}
function mtGroup(label,list,sub,first){
  if(!list.length)return '';
  return '<div class="grp"><h3>'+label+' ('+list.length+')</h3>'+(sub?'<p class="gsub">'+sub+'</p>':'')+list.map((t,j)=>mtCard(t,j+1,!!first&&j===0)).join('')+'</div>';

function mtGroups(list){
  const todo=list.filter(t=>t.st==='todo').map((t,i)=>[t,i]).sort((a,b)=>(mtUrgent(b[0])-mtUrgent(a[0]))||(a[1]-b[1])).map(x=>x[0]);
  return mtGroup('지금 할 수 있는 단계',todo,'',true)+mtGroup('아직 열리지 않은 단계',list.filter(t=>t.st==='wait'),'앞 단계가 끝나면 자동으로 열려요. 내가 할 일 페이지를 열어 두면 30초마다 자동으로 확인해요.',false);
}
function mtAlert(list){
  const open=list.filter(t=>t.st!=='done'&&mtHasDue(t));
  const today=open.filter(t=>mtDleft(t.due)<=0).length,soon=open.filter(t=>mtDleft(t.due)>0&&mtDleft(t.due)<=3).length;
  if(!today&&!soon)return '';
  const parts=[];if(today)parts.push('오늘 마감 '+today+'건');if(soon)parts.push('마감 임박 '+soon+'건');
  return '<div class="alert"><b>'+parts.join(', ')+'</b><br>마감일이 지나면 링크가 닫힙니다. 빨간색으로 표시된 단계를 먼저 진행해 주세요.</div>';
}

    '<tr><td style="'+F+'padding:10px 26px 4px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>'+
      '<td width="6" bgcolor="#1F6FEB" style="'+F+'background:#1F6FEB;width:6px;font-size:1px">&nbsp;</td>'+
      '<td bgcolor="#EAF1FE" style="'+F+'background:#EAF1FE;padding:16px 18px">'+
        '<div style="'+F+'font-size:10.5pt;color:#4a556a;margin:0 0 12px">'+E(N.what)+'</div>'+
        '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr><td bgcolor="#1F6FEB" style="'+F+'background:#1F6FEB;padding:10px 22px"><a href="'+E(N.hub)+'" style="'+F+'color:#ffffff;font-weight:bold;text-decoration:none;font-size:10.5pt">내가 할 일 열기</a></td></tr></table>'+
      '</td></tr></table></td></tr>'+
    '<tr><td style="'+F+'padding:16px 26px 22px;font-size:9.5pt;color:#4a556a">&#8251; '+E(MT_FALLBACK)+' <a href="'+E(N.direct)+'" style="color:#1F6FEB;font-weight:bold;text-decoration:underline">바로가기</a></td></tr>'+
    '</table></div>';
}
function mtMailPlain(N){return mtOpenLine(N)+'\n\n'+N.to+', 내가 해야 할 일에 링크가 열렸습니다!\n'+N.what+'\n\n내가 할 일 열기: '+N.hub+'\n\n※ '+MT_FALLBACK+'\n바로가기: '+N.direct;}
function mtB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function mtMakeEml(N){
  const wrap=s=>s.replace(/(.{76})/g,'$1\r\n');
  return 'X-Unsent: 1\r\nSubject: =?UTF-8?B?'+mtB64(N.subj)+'?=\r\nMIME-Version: 1.0\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap(mtB64(mtMailHTML(N)))+'\r\n';
}
function mtNotify(){return MT._notify||null;}
function mtDownloadEml(){
  const N=mtNotify();if(!N)return;
  const blob=new Blob([mtMakeEml(N)],{type:'message/rfc822'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='온보딩점검_완료안내.eml';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  mtToast('내려받은 "온보딩점검_완료안내" 파일을 열면 Outlook 메일 작성창이 열립니다. 받는 사람만 선택해 보내세요.');
}
function mtCopyPlain(text,msg){
  const ok=()=>mtToast(msg);
  const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();const r=document.execCommand('copy');document.body.removeChild(ta);if(r){ok();return;}}catch(e){}mtToast('자동 복사가 막혀 있어요. 미리보기 내용을 직접 선택해 복사해 주세요.');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok).catch(legacy);}else legacy();
}
function mtCopyRich(){
  const N=mtNotify();if(!N)return;
  const html=mtMailHTML(N),plain=mtMailPlain(N);
  if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]).then(()=>mtToast('서식 그대로 복사했습니다. 새 메일 본문에 붙여넣으세요.')).catch(()=>mtCopyPlain(plain,'메일 내용을 복사했습니다. 새 메일 본문에 붙여넣으세요.'));
  }else mtCopyPlain(plain,'메일 내용을 복사했습니다. 새 메일 본문에 붙여넣으세요.');
}
function mtNotifyBox(N){
  return '<div class="box"><h3>'+mtEsc(N.to)+'께 완료 메일을 보내 주세요</h3>'+
    '<p class="lead">'+mtEsc(N.to)+'의 <b>내가 할 일</b> 페이지에 다음 단계가 <b>자동으로 열렸습니다.</b><br><span class="mtone">메일 한 통에 열렸다는 안내와, 그 페이지에서 열리지 않을 때 쓰는 바로가기 링크가 함께 들어갑니다.</span></p>'+
    '<div class="act"><button class="btn primary" onclick="mtDownloadEml()">완료 메일 작성</button><button class="btn ghost" onclick="mtCopyRich()">메일 내용 복사</button></div>'+
    '<ul class="mtnote"><li>"완료 메일 작성" 버튼을 눌러서 다운된 파일을 여세요. 아래 내용이 자동으로 채워진 Outlook으로 연결됩니다.<br>(Chrome은 다운로드 표시줄, Edge는 다운로드 창에서 파일 열기)</li><li>또는 "메일 내용 복사"를 클릭하여 직접 복사-붙여넣기 하셔도 됩니다.</li></ul>'+
    '<div class="sub2"><b>보내지는 메일 미리보기</b><div class="pv"><div class="pvsub"><b>제목</b> '+mtEsc(N.subj)+'</div><div class="pvbody">'+mtMailHTML(N)+'</div></div></div></div>';
}

/* 제출이 끝난 직후 호출: 남은 단계와 완료 메일을 #mtExtra에 채운다. 응답이 없으면 내가 할 일 링크만 안내한다. */
/* 허브가 링크에 실어 준 다음 사람 정보(nxto, nxhub, nxd). 없으면 null */
function mtNxFromUrl(){
  try{const q=new URLSearchParams(location.search),to=q.get('nxto'),hub=q.get('nxhub'),d=q.get('nxd');return(to&&(hub||d))?{to:to,hub:hub||'',direct:d||''}:null;}catch(e){return null;}
}
function mtAfterDone(){
  const box=document.getElementById('mtExtra');
  if(!box||!MT.me)return;
  const hub=mtHubUrl();
  let shown=false;
  const NX=mtNxFromUrl(),earlyN=NX?mtNotifyOf({k:MT.k,who:MT.who,next:NX}):null;   /* 서버 응답 없이도 완료 메일 박스를 먼저 보여 준다 */
  MT._notify=earlyN;
  const early=()=>earlyN?mtNotifyBox(earlyN):'';
  box.innerHTML=early()+'<div class="box"><p class="lead" style="margin:0">다음 단계를 확인하고 있어요... 서버가 바쁠 때는 1분 정도 걸릴 수 있어요.</p><p class="foot" style="margin:8px 0 0">기다리지 않고 <a href="'+mtEsc(hub)+'">내가 할 일</a> 페이지에서 바로 확인하셔도 됩니다.</p></div>';
  const fail=()=>{box.innerHTML=early()+'<div class="box"><p class="lead" style="margin:0 0 12px">다음 단계를 아직 불러오지 못했어요. 서버가 바쁜 것 같아요.</p><div class="mini-actions"><button class="btn ghost sm" onclick="mtAfterDone()">다시 불러오기</button><a class="btn primary sm link" href="'+mtEsc(hub)+'">내가 할 일에서 확인</a></div></div>';};
  const prep=(r)=>{
    const tasks=r.data.tasks;
    let mine=null;
    tasks.forEach(t=>{if(t.k===MT.k&&(!MT.code||t.code===MT.code)){t.st='done';mine=t;}});   /* 방금 낸 단계는 서버 반영이 늦어도 완료로 표시 */
    return {tasks:tasks,mine:mine,sig:tasks.map(t=>t.k+'|'+t.code+'|'+t.st).join(',')};
  };
  const show=(P)=>{
    const tasks=P.tasks;
    MT.tasks=tasks;MT._sig=P.sig;shown=true;
    const N=mtNotifyOf(P.mine)||earlyN;MT._notify=N;
    const rest=tasks.filter(t=>t.st!=='done'),n=tasks.length,dn=n-rest.length;
    let h=N?mtNotifyBox(N):'';
    if(rest.length){
      h+='<div class="box"><h3>남은 단계가 '+rest.length+'개 있어요</h3><p class="lead">아래 버튼으로 바로 이어서 진행할 수 있어요.</p>'+mtAlert(rest)+
        '<div class="pg"><span>전체 '+n+'단계 중 '+dn+'단계 완료</span><div class="bar"><i style="width:'+Math.round(dn/n*100)+'%"></i></div></div>'+
        mtGroups(rest)+'<p class="foot">전체 현황은 <a href="'+mtEsc(hub)+'">내가 할 일</a> 페이지에서 언제든 확인할 수 있어요.</p></div>';
    }else{
      h+='<div class="box ok"><h3>모든 단계를 마쳤습니다</h3><p class="lead" style="margin-bottom:0">추가로 하실 일은 없습니다. 수고하셨습니다.</p></div>';
    }
    box.innerHTML=h;
  };
  /* 미리 받아 둔 목록이 있으면 바로 보여 주고, 최신 목록은 뒤에서 받아 달라진 때만 다시 그린다 */
  const fresh=()=>mtFetch(r=>{
    if(r&&r.ok&&r.data){const P=prep(r);if(!shown||P.sig!==MT._sig)show(P);}
    else if(!shown)fail();
  });
  if(MTPRE.done&&MTPRE.r){show(prep(MTPRE.r));fresh();}
  else if(MTPRE.started&&!MTPRE.done){MTPRE.cbs.push(r=>{if(r)show(prep(r));fresh();});}
  else fresh();
}

/* eref 코드로 서버(_pending_approval 시트)에서 팀장 데이터를 조회한다(JSONP). */
function loadExecRef(code,done){
  /* 서버 응답이 간헐적으로 10초 이상(최대 1분 넘게) 걸리는 경우가 있어 길게 기다리고, 오류나 시간 초과면 한 번 더 시도한다(먼저 온 정상 응답 사용) */
  let finished=false,attempt=0; const finish=()=>{ if(finished)return; finished=true; done(); };
  const handle=(resp)=>{
    if(finished)return;
    if(resp && resp.ok && resp.data && resp.data.status==='done'){ ALREADY_DONE=true; }
    else if(resp && resp.ok && resp.data && resp.data.teamLead){ HM_DATA=resp.data.teamLead; }
    else{ EXEC_LOAD_FAILED=true; if(resp && resp.error==='not_found') EXEC_NOT_READY=true; } /* 조회 실패: 1단계(팀장 작성) 화면으로 넘기지 않고 안내. not_found는 팀장 평가가 아직 제출되지 않은 상태 */
    finish();
  };
  const retryOrFail=()=>{ if(finished)return; if(attempt<2) send(); else { if(!HM_DATA) EXEC_LOAD_FAILED=true; finish(); } };
  const send=()=>{
    attempt++;
    const cb='__execRefCb'+attempt;
    window[cb]=handle;
    const s=document.createElement('script');
    s.src=SUBMIT_URL+'?action=getPending&code='+encodeURIComponent(code)+'&callback='+cb+'&_='+Date.now();
    s.onerror=()=>{ setTimeout(retryOrFail,1500); };
    document.body.appendChild(s);
    setTimeout(retryOrFail, attempt===1?35000:40000);
  };
  send();
}
function renderAlreadyDone(){
  document.querySelector('.wrap').innerHTML = `<div class="topbar"><div class="brand"><div class="mk">HR</div>
      <div><b>온보딩 적응 만족도 · 담당임원 결재</b><span>인재개발팀 · Talent Development</span></div></div></div>
    <div class="card" style="text-align:center;padding:50px 20px">
      <h2 style="margin:0 0 8px">${STAGE==='exec'?'이미 결재가 완료된 링크입니다':'이미 제출이 완료된 링크입니다'}</h2>
      <p style="color:var(--ink-soft);margin:0">제출한 내용은 개인정보 보호를 위해 다시 볼 수 없습니다. 수정이 필요하면 인재개발팀으로 문의해 주세요.</p>
      ${ME_TOKEN?'<div style="margin-top:16px"><a class="btn primary" style="text-decoration:none" href="'+mtEsc(mtHubUrl())+'">내가 할 일로 돌아가기</a></div>':''}
    </div>`;
}
function bootAfterExecRef(){
  if(ALREADY_DONE){ renderAlreadyDone(); return; }
  if(_linkCode && SUBMIT_URL){
    if(!LINK_BLOCKING){
      startExecLinkCheck(_linkCode);
      EXL.released=true;   /* released: 늦게 오는 닫힘/완료 응답이 화면을 바꾸도록 */
      if(EXL.st){ EXL.st==='done' ? renderAlreadyDone() : renderClosedExec(); return; }
      startApp(); return;
    }
    checkLinkStatusExec(_linkCode, st=>{ st==='done' ? renderAlreadyDone() : st ? renderClosedExec() : startApp(); });
  }else{
    startApp();
  }
}
if(STAGE==='exec' && !HM_DATA && _linkCode && SUBMIT_URL){
  try{ document.getElementById('stagePill').textContent='불러오는 중…'; document.getElementById('stageDesc').textContent='팀장 평가 내용을 불러오고 있어요. 서버가 바쁠 때는 최대 1분 정도 걸릴 수 있으니 화면을 닫지 말고 기다려 주세요.'; }catch(e){}
  startExecLinkCheck(_linkCode);   /* 링크 확인은 팀장 평가 조회와 동시에 보낸다(순서대로 보내면 두 번 기다림) */
  loadExecRef(_linkCode, bootAfterExecRef);
}else{
  bootAfterExecRef();
}
if(ME_TOKEN) setTimeout(()=>mtPrefetch(ME_TOKEN),20000);   /* 제출 직후 남은 단계를 바로 보여 주기 위해 미리 받아 둠 */
</script>
